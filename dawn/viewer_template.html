<!-- dawn viewer — the Phase 4 replay viewer (VIEWER.md), scaffold.

A replay client: this file consumes the run bundle baked into it and renders
a finished history. Journal → pixels; nothing here feeds back into the sim.
All invented geometry (site plans, tents, banners) is deterministic from
bundle + seed and evidence-free: it decorates what the record is silent
about and never contradicts it (the elaboration rule, VIEWER.md §0).

Three.js is vendored inline below (no CDN — offline use, artifact CSP, and
twenty-year replayability). Scaffold status per system is marked [SCAFFOLD]
where the full treatment in VIEWER.md §§2–4 is still to come. -->

const THREE = window.THREE;

// The whole app lives in boot(DATA) so a dropped bundle can replace the
// world: abort the old session's listeners and render loop, start anew.
let bootCtl = null;
function boot(DATA) {
  if (bootCtl) bootCtl.abort();
  const ctl = bootCtl = new AbortController();
  const sig = {signal: ctl.signal};

const BIOME_TINT = [[214,205,159],[157,185,138],[181,203,150],

// axes: 0 rank 1 display 2 nomadism 3 closed 4 accumulation 5 command 6 sacred 7 violence
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;

// Authored in sRGB, like the `hsl()` the legend swatches use. Without the
// colour-space argument three takes these as already-linear and lifts them on
// output, so the same culture came out paler in the world than on its own
// chip — the two have been disagreeing, and the swatch was the honest one.
function colorOf(cid, l = 0.5) {
  return new THREE.Color().setHSL(hueOf(cid) / 360, 0.5, l, THREE.SRGBColorSpace);

// ---- deterministic detail noise (the elaboration rule, §0) ------------------
// The record carries one elevation value per cell; everything finer is the
// record's silence, which the viewer may decorate — deterministically, so the
// same bundle always wears the same ridgelines. Integer hashing only; no
// Math.random anywhere in the painter.
const NSEED = Math.imul(DATA.seed | 0, 1013904223) | 0;
function hash2(ix, iy, s) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(s | 0, -1640531527);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;

function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);

// ---- small geometry forge ----------------------------------------------------
// Buildings, ships and trees are single meshes (the slot system morphs one
// geometry per element), so compound forms are merged here with their colors
// baked into a vertex-color attribute. Materials with vertexColors:true pick
// the baked colors up, tinted by material.color; materials without it ignore
// the attribute entirely.
// Baked colours are *relative*: a paintbox entry is divided by a mid-grey
// reference before it reaches the attribute, so what lands in the buffer is a
// multiplier around 1.0 rather than an absolute colour. That is what lets one
// geometry serve every culture — material.color still carries the identity hue
// (or the neutral stone/straw of an unattested form), and the vertex colours
// only say which parts of the form are timber, thatch or canvas relative to it.
// The reference sits near the brightest paintbox entry, not at mid-grey, so
// every multiplier lands in roughly 0.4–1.2: dark timber genuinely darkens, and
// canvas or pale plaster lifts a little without clipping the tint to white.
const SHADE_REF = 0.75;

// only by ambient returns the same colour on all six faces, which is most of
// what "blocky" actually means — the silhouette is fine, the faces just do not
// separate. Darkening each face by its own normal before any light reaches it
// gives every built thing form it keeps at any hour, undersides included.
const FORM_L = [-0.4529, 0.7851, -0.4227];
const formShade = (nx, ny, nz) => {
  const d = nx * FORM_L[0] + ny * FORM_L[1] + nz * FORM_L[2];
  return 0.80 + 0.30 * Math.max(0, Math.min(1, d * 0.5 + 0.5));

  const na = geo.attributes.normal;

    const f = na ? formShade(na.getX(i), na.getY(i), na.getZ(i)) : 1;
    cs[i * 3] = s[0] * f; cs[i * 3 + 1] = s[1] * f; cs[i * 3 + 2] = s[2] * f;
  }

  return geo;
}

    const g = part.g.index ? part.g.toNonIndexed() : part.g;
    const p = _mp.p, s = _mp.s, q = _mp.q, e = _mp.e, m4 = _mp.m4;

      vs.push(_mp.v.x, _mp.v.y, _mp.v.z);

  geo.setAttribute("position", new THREE.Float32BufferAttribute(vs, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(ns, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(cs, 3));

}

const C = {

  hide: [0.74, 0.65, 0.51], hideD: [0.58, 0.49, 0.37], stone: [0.55, 0.53, 0.49],
  stoneD: [0.40, 0.38, 0.35], slate: [0.32, 0.34, 0.39], pale: [0.85, 0.82, 0.72],
  wood: [0.33, 0.25, 0.15], woodD: [0.24, 0.18, 0.11], canvas: [0.90, 0.85, 0.70],

const G = DATA.grid, T = DATA.ticks;

// ---- territory reconstruction: owner0 + deltas ------------------------------
const deltas = DATA.deltas.slice().sort((a, b) => a.tick - b.tick);
let owner = null, appliedTo = -1;
function ownerAt(tick) {

    owner = DATA.owner0.map(r => r.slice());

    if (d.tick <= appliedTo) continue;
    for (const [x, y] of d.cells) owner[x][y] = d.to;

    // out with the form — a struck camp's fires are struck too.

    if (spot.kind === "hearth" || spot.kind === "lodge" || spot.kind === "keep") {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial(
        {map: fireGlowTex, transparent: true, opacity: 0,
         color: new THREE.Color(0xffa050).multiplyScalar(2.3),
         blending: THREE.AdditiveBlending, depthWrite: false}));
      sp.scale.setScalar(spot.kind === "hearth" ? 0.5 : 0.7);
      sp.position.y = spot.kind === "hearth" ? 0.12 : 0.18;
      m.add(sp);
      slot.glow = sp;
      slot.phase = hash2(m.id, 7, NSEED + 6400) * 6.283;
    }
  }
  // Regalia announce themselves: the crown swells and settles after fusion.
  if (id === "crown" && crownPulse && crownPulse.cid === +cid) {
    const age = (now - crownPulse.t0) / 1000;
    if (age > 6) crownPulse = null;
    else scale *= 1 + Math.max(0, Math.sin(age * 3)) * Math.exp(-age * 0.6);
  }
  m.scale.setScalar(scale);
  toWorld(x, y, m.position);
  m.position.y += LIFT[spot.kind] !== undefined ? LIFT[spot.kind] : 0.1 * scale;
}

function updateSettlements(t) {
  const tick = Math.floor(t);
  assignCharges(tick);
  const sum = summaryAt(tick), alive = new Set();
  const now = performance.now();
  // The year holds its form, then moves: stable for most of the season, the
  // walk in its last third. Struck camps do not teleport.
  const frac = t - tick;
  const u = frac < 0.62 ? 0 : ease((frac - 0.62) / 0.38);
  for (const cid of Object.keys(sum.c)) {
    alive.add(cid);
    const A = cachedLayout(+cid, tick, sum, tick % 4);
    if (!A) continue;
    const B = u > 0 ? (cachedLayout(+cid, tick, sum, (tick + 1) % 4) || A) : A;
    const g = ensureGroup(cid, A.conf);
    g.anchor = sitesOf(+cid, tick)?.anchor;
    const mapA = new Map(A.spots.map(s2 => [s2.id, s2]));
    const mapB = new Map(B.spots.map(s2 => [s2.id, s2]));
    const seen = new Set();
    for (const id of new Set([...mapA.keys(), ...mapB.keys()])) {
      const a = mapA.get(id), b = mapB.get(id);
      const src = a || b, dst = b || a;
      seen.add(id);
      placeSlot(g, cid, id, u < 0.5 ? src : dst,
                src.x + (dst.x - src.x) * u, src.y + (dst.y - src.y) * u,
                (a ? a.s : 0) + ((b ? b.s : 0) - (a ? a.s : 0)) * u, now);
    }
    for (const [id, slot] of g.slots)
      if (!seen.has(id)) slot.mesh.visible = false;
  }
  for (const [cid, g] of groups)
    if (!alive.has(cid)) { scene.remove(g.group); groups.delete(cid); }
  updateCrownScars(tick);
}

// ---- vegetation: the record's silence, densely decorated (§0, §2) -----------
// Biome is a worldgen product exported for rendering and it never drives
// culture — the same standing as elevation — so forests are elaboration of the
// safest kind: they say nothing about anybody. Placement is hashed from the
// seed, so a bundle always grows the same wood.
//
// Everything is instanced: two draw calls per species, trunks and canopies
// apart so an instance colour can dress the leaves without muddying the wood.
// The seasonal ramp is four colour buffers computed once and swapped, not a
// per-tree recolour every tick — and winter swaps the canopy matrices too, for
// the bare form the brief asks for.
const VEG = {
  //          density  pine share
  steppe:        [0.14, 0.05],
  forest:        [4.60, 0.28],
  river_valley:  [1.70, 0.08],
  coast:         [0.55, 0.10],
  mountain:      [1.80, 0.88],
  desert:        [0.03, 0.00],
};
const VEG_BY_INDEX = ["steppe", "forest", "river_valley", "coast", "mountain", "desert"]
  .map(b => VEG[b]);

// Leaves take the season; needles barely move, which is most of what tells the
// two apart from altitude in autumn.
const LEAF = {
  broad: [[0.44, 0.63, 0.28], [0.29, 0.49, 0.21], [0.74, 0.45, 0.15], [0.44, 0.36, 0.29]],
  pine:  [[0.21, 0.41, 0.25], [0.18, 0.36, 0.22], [0.20, 0.34, 0.20], [0.17, 0.29, 0.21]],
};

// A canopy is lit from above by its own vertex colours, so even a flat instance
// colour reads as a rounded mass rather than a paper cut-out.
function gradeCanopy(geo, lo, hi) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox, span = Math.max(1e-6, bb.max.y - bb.min.y);
  // Multiplies into whatever mergeParts already baked — the form shading is
  // underneath this, and overwriting would throw it away.
  const p = geo.attributes.position, c = geo.attributes.color;
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) - bb.min.y) / span, k = lo + (hi - lo) * (t * t * (3 - 2 * t));
    c.array[i * 3] *= k; c.array[i * 3 + 1] *= k; c.array[i * 3 + 2] *= k;
  }
  c.needsUpdate = true;
  return geo;
}
const ico = (r, d) => new THREE.IcosahedronGeometry(r, d);
const TRUNK = {
  broad: mergeParts([{g: cyl(0.028, 0.045, 0.30, 5), c: C.woodD, p: [0, 0.15, 0]}]),
  pine:  mergeParts([{g: cyl(0.022, 0.040, 0.24, 5), c: C.woodD, p: [0, 0.12, 0]}]),
};
// Four overlapping blobs, deliberately off-centre: a canopy with one axis of
// asymmetry stops a hillside of trees looking like a bed of identical bushes.
// The main blob gets detail-1 facets; the offsets stay coarse — close-up is
// where the wander fade steps in anyway, so the extra triangles buy
// silhouette at map range, where they are actually seen.
const CANOPY = {
  broad: gradeCanopy(mergeParts([
    {g: ico(0.19, 1), c: [1, 1, 1], p: [0, 0.42, 0]},
    {g: ico(0.135, 0), c: [1, 1, 1], p: [0.10, 0.33, 0.05], s: [1, 0.85, 1]},
    {g: ico(0.12, 0), c: [1, 1, 1], p: [-0.08, 0.36, -0.07]},
    {g: ico(0.09, 0), c: [1, 1, 1], p: [0.02, 0.52, -0.04]},
  ]), 0.72, 1.16),
  pine: gradeCanopy(mergeParts([
    {g: cone(0.175, 0.24, 7), c: [1, 1, 1], p: [0, 0.26, 0]},
    {g: cone(0.145, 0.24, 7), c: [1, 1, 1], p: [0, 0.37, 0]},
    {g: cone(0.11, 0.21, 7), c: [1, 1, 1], p: [0, 0.48, 0]},
    {g: cone(0.07, 0.17, 7), c: [1, 1, 1], p: [0, 0.58, 0]},
  ]), 0.66, 1.18),
};

// Where people live, the wood is cleared. Anchors are sampled across the whole
// run rather than read at one tick, so a camp that moves in year 300 is not
// found standing in a thicket — and the clearing is the one place vegetation
// touches the record at all, by staying out of its way.
function clearedCells(r = 2) {
  const cleared = new Set();
  for (const s of sums) {
    for (const cid of Object.keys(s.c)) {
      const site = sitesOf(+cid, s.tick);
      if (!site || !site.anchor) continue;
      const [ax, ay] = site.anchor;
      for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++)
        if (dx * dx + dy * dy <= r * r)
          cleared.add(((ax + dx) | 0) * 1000 + ((ay + dy) | 0));
    }
  }
  return cleared;
}

const forest = {broad: null, pine: null, season: -1};
function plantForest() {
  const cleared = clearedCells();
  const place = {broad: [], pine: []};
  for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) {
    if (DATA.water[x][y]) continue;
    // A softened bank can dip a shore cell under the waterline; nothing is
    // planted where the sheet would close over it.
    if (heightAt(x, y) < 0.05) continue;
    if (cleared.has(x * 1000 + y)) continue;
    const [density, pineShare] = VEG_BY_INDEX[DATA.biome[x][y]] || VEG_BY_INDEX[0];
    // Fractional density becomes a probability, so a sparse biome scatters
    // instead of banding at the cell grid.
    const whole = Math.floor(density);
    const n = whole + (hash2(x, y, NSEED + 101) < density - whole ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const h1 = hash2(x * 7 + i, y * 13 + i * 3, NSEED + 211 + i);
      const h2 = hash2(x * 11 + i * 5, y * 3 + i, NSEED + 307 + i);
      const h3 = hash2(x + i * 17, y + i * 19, NSEED + 401 + i);
      const h4 = hash2(x * 5 + i, y * 23 + i, NSEED + 503 + i);
      const px = x + (h1 - 0.5) * 0.92, py = y + (h2 - 0.5) * 0.92;
      const kind = h3 < pineShare ? "pine" : "broad";
      place[kind].push({x: px, y: py, s: 0.72 + h4 * 0.66, rot: h1 * 6.283});
    }
  }

  const v = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const e = new THREE.Euler(), m4 = new THREE.Matrix4();
  const h1of = t => hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 771);
  const h2of = t => hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 772);
  const h3of = t => hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 773);
  for (const kind of ["broad", "pine"]) {
    const list = place[kind];
    if (!list.length) continue;
    const trunkMat = new THREE.MeshLambertMaterial({color: 0x8a7a63, vertexColors: true});
    const leafMat = new THREE.MeshLambertMaterial({color: 0xffffff, vertexColors: true});
    leafMat.onBeforeCompile = sh => {
      sh.uniforms.uWindT = WIND.uT; sh.uniforms.uWindG = WIND.uG;
      sh.vertexShader = "uniform float uWindT; uniform float uWindG;\n" +
        sh.vertexShader.replace("#include <begin_vertex>",
          `#include <begin_vertex>
           {
             float wph = instanceMatrix[3][0] * 1.7 + instanceMatrix[3][2] * 2.3;
             float wsw = sin(uWindT * 1.9 + wph) + 0.5 * sin(uWindT * 3.7 + wph * 1.3);
             float lift = max(0.0, position.y);
             transformed.x += wsw * uWindG * lift;
             transformed.z += wsw * 0.6 * uWindG * lift;
           }`);
    };
    const trunks = new THREE.InstancedMesh(TRUNK[kind], trunkMat, list.length);
    const leaves = new THREE.InstancedMesh(CANOPY[kind], leafMat, list.length);
    // Winter bares the broadleaves: same trunks, a smaller sparser crown.
    const full = new Float32Array(list.length * 16), bare = new Float32Array(list.length * 16);
    list.forEach((t, i) => {
      toWorld(t.x, t.y, v);
      v.y -= 0.03;   // planted, not placed: the bole bites into the ground
      e.set(0, t.rot, 0); q.setFromEuler(e);
      // Per-instance squash, the same factors for full and bare so winter
      // thins a crown without changing its shape.
      const sqx = 0.88 + h2of(t) * 0.24, sqy = 0.85 + h3of(t) * 0.30,
            sqz = 0.88 + h1of(t) * 0.24;
      sc.set(t.s * sqx, t.s * sqy, t.s * sqz); m4.compose(v, q, sc); m4.toArray(full, i * 16);
      const b = (kind === "pine" ? t.s : t.s * 0.6);
      sc.set(b * sqx, (kind === "pine" ? t.s : t.s * 0.78) * sqy, b * sqz);
      m4.compose(v, q, sc); m4.toArray(bare, i * 16);
      trunks.setMatrixAt(i, new THREE.Matrix4().fromArray(full, i * 16));
    });
    leaves.instanceMatrix.array.set(full);
    trunks.instanceMatrix.needsUpdate = true;
    leaves.instanceMatrix.needsUpdate = true;
    // Four seasons of instance colour, computed once.
    const cols = LEAF[kind].map(base => {
      const arr = new Float32Array(list.length * 3);
      list.forEach((t, i) => {
        const j = hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 601);
        const k = 0.86 + j * 0.30;
        arr[i * 3] = Math.min(1, base[0] * k);
        arr[i * 3 + 1] = Math.min(1, base[1] * (0.90 + j * 0.22));
        arr[i * 3 + 2] = Math.min(1, base[2] * k);
      });
      return arr;
    });
    leaves.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cols[0]), 3);
    trunks.frustumCulled = false; leaves.frustumCulled = false;
    trunks.castShadow = leaves.castShadow = true;
    scene.add(trunks, leaves);
    forest[kind] = {trunks, leaves, cols, full, bare, n: list.length, pts: list};
  }
}
// Wind in the crowns: a vertex sway patched into the leaf material, phasing
// off each instance's own translation so the stand never moves as one sheet.
// The §7 hazard is respected — the patched material is used by exactly these
// InstancedMeshes and their instanceColor is always set below. Gusts follow
// the recorded storm severity, so a hard winter moves the trees, the snow,
// and the wind sound together.
const WIND = {uT: {value: 0}, uG: {value: 0.02}};
plantForest();

// A walker's relationship with the wood: trunks are solid, and a canopy you
// are about to wear steps aside. The trees were authored for 800 m away;
// at 0.55 m the 20-face crowns are paper, so instead of letting the camera
// clip through them we fade each crown that comes within reach and glide
// around the trunk that stays. One spatial hash over world positions serves
// both courtesies.
const treeHash = new Map();   // "cx,cz" (3-unit cells) -> [{kind, i, wx, wz, s}]
const TREE_CELL = 3;
for (const kind of ["broad", "pine"]) {
  const f = forest[kind];
  if (!f) continue;
  f.pts.forEach((t, i) => {
    const wx = t.x - G / 2, wz = t.y - G / 2;
    const key = Math.floor(wx / TREE_CELL) + "," + Math.floor(wz / TREE_CELL);
    if (!treeHash.has(key)) treeHash.set(key, []);
    treeHash.get(key).push({kind, i, wx, wz, s: t.s});
  });
}
function treesNear(wx, wz, r) {
  const out = [], span = Math.ceil(r / TREE_CELL);
  const ix = Math.floor(wx / TREE_CELL), iz = Math.floor(wz / TREE_CELL);
  for (let dx = -span; dx <= span; dx++) for (let dz = -span; dz <= span; dz++) {
    const bucket = treeHash.get((ix + dx) + "," + (iz + dz));
    if (bucket) for (const t of bucket)
      if (Math.hypot(t.wx - wx, t.wz - wz) < r) out.push(t);
  }
  return out;
}
// Canopy fade: shrink the crown instances near the walker toward nothing.
// The seasonal swap rewrites the whole matrix buffer, so the fade must be
// re-derived each frame from the season's own matrices — never cached.
const fadedTrees = new Map();   // "kind|i" -> true while shrunk
const _fm = new THREE.Matrix4(), _fs = new THREE.Matrix4();
function updateTreeFade() {
  if (!wander && fadedTrees.size === 0) return;
  const near = wander ? treesNear(wander.x, wander.z, 2.6) : [];
  const nearKeys = new Set(near.map(t => t.kind + "|" + t.i));
  for (const t of near) {
    const d = Math.hypot(t.wx - wander.x, t.wz - wander.z);
    const k = Math.max(0.04, Math.min(1, (d - 1.0) / 1.6));
    if (k >= 1 && !fadedTrees.has(t.kind + "|" + t.i)) continue;
    const f = forest[t.kind];
    _fm.fromArray((forest.season === 3 ? f.bare : f.full), t.i * 16);
    _fm.multiply(_fs.makeScale(k, k, k));   // right-multiply: the trunk stays put
    f.leaves.setMatrixAt(t.i, _fm);
    f.leaves.instanceMatrix.needsUpdate = true;
    fadedTrees.set(t.kind + "|" + t.i, true);
  }
  for (const key of fadedTrees.keys()) {
    if (nearKeys.has(key)) continue;
    const [kind, i] = key.split("|"), f = forest[kind];
    f.leaves.instanceMatrix.array.set(
      (forest.season === 3 ? f.bare : f.full).slice(+i * 16, +i * 16 + 16), +i * 16);
    f.leaves.instanceMatrix.needsUpdate = true;
    fadedTrees.delete(key);
  }
}

function updateForest(tick) {
  const season = tick % 4;
  if (season === forest.season) return;
  forest.season = season;
  for (const kind of ["broad", "pine"]) {
    const f = forest[kind];
    if (!f) continue;
    f.leaves.instanceColor.array.set(f.cols[season]);
    f.leaves.instanceColor.needsUpdate = true;
    f.leaves.instanceMatrix.array.set(season === 3 ? f.bare : f.full);
    f.leaves.instanceMatrix.needsUpdate = true;
  }
}

// ---- scatter: the small things that make the tents big ----------------------
// A diorama is a world where everything is the same size. These are an order
// under the structures — stones on the slopes and shores, scrub tufts in the
// green biomes — so the eye gets a small reference and a lodge reads as a
// building. Seeded placement on the record's own land, sitting on the fine
// surface like everything else. Stumps were considered and refused: a felled
// tree asserts logging, and the record does not.
const SCATTER = {stones: 0, scrub: 0};
{
  const stones = [], scrub = [];
  const cl = v => Math.max(0, Math.min(G - 1, v));
  for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) {
    if (DATA.water[x][y] || heightAt(x, y) < 0.05) continue;
    const slope = Math.hypot(heightAt(cl(x + 1), y) - heightAt(cl(x - 1), y),
                             heightAt(x, cl(y + 1)) - heightAt(x, cl(y - 1)));
    const h1 = hash2(x, y, NSEED + 910), h2 = hash2(x, y, NSEED + 920),
          h3 = hash2(x, y, NSEED + 930), h4 = hash2(x, y, NSEED + 940);
    // Stones favour slope, the places the soil lets go of them.
    if (h1 < 0.16 + Math.min(0.55, slope * 2.2))
      stones.push({x: x + (h2 - 0.5) * 0.9, y: y + (h3 - 0.5) * 0.9,
                   s: 0.5 + h4 * 1.1, rot: h2 * 6.283});
    const [veg] = VEG_BY_INDEX[DATA.biome[x][y]] || VEG_BY_INDEX[0];
    if (h2 < 0.22 + Math.min(0.5, veg * 0.8))
      scrub.push({x: x + (h3 - 0.5) * 0.95, y: y + (h1 - 0.5) * 0.95,
                  s: 0.6 + h4 * 0.9, rot: h3 * 6.283});
  }
  const v = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3(),
        e = new THREE.Euler(), m4 = new THREE.Matrix4();
  const lay = (geo, list, squash, tint) => {
    const mat = new THREE.MeshLambertMaterial({color: 0xffffff});
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    const col = new Float32Array(list.length * 3);
    list.forEach((t, i) => {
      toWorld(t.x, t.y, v); v.y -= 0.008;
      e.set(0, t.rot, 0); q.setFromEuler(e);
      sc.set(t.s, t.s * squash, t.s);
      m4.compose(v, q, sc); mesh.setMatrixAt(i, m4);
      const j = 0.82 + hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 950) * 0.36;
      col[i * 3] = Math.min(1, tint[0] * j);
      col[i * 3 + 1] = Math.min(1, tint[1] * j);
      col[i * 3 + 2] = Math.min(1, tint[2] * j);
    });
    mesh.instanceColor = new THREE.InstancedBufferAttribute(col, 3);
    mesh.receiveShadow = true; mesh.frustumCulled = false;
    scene.add(mesh);
    return mesh;
  };
  lay(ico(0.06, 0), stones, 0.55, [0.55, 0.52, 0.47]);
  lay(cone(0.05, 0.11, 4).translate(0, 0.055, 0), scrub, 0.8, [0.42, 0.46, 0.27]);
  SCATTER.stones = stones.length; SCATTER.scrub = scrub.length;
}

// ---- ground cover: grass, understory, specks (GAP §2) -----------------------
// The missing bottom layer. Canopy trees over painted ground left the world
// bald between its trees — no middle storey, no bottom storey, nothing that
// moves at ankle height. Grass fills the bottom third of every wander frame;
// bushes make a wood's edge an edge; ferns say wet ground; specks read at
// exactly the distance grass stops reading. All of it is elaboration of the
// record's silence (§0): placement is driven by fields the record already
// prices — biome, distance to water, the forest field — it stays out of the
// clearings people live in, and there is no agriculture in it (GAP §7's
// refusal stands: a meadow, never a field).
const GROUND = {grass: 0, bush: 0, fern: 0, sapling: 0,
                cells: {land: 0, river: 0, cleared: 0, steep: 0, planted: 0}};
const groundCover = {season: -1, layers: [], seedheads: null, snowdust: null};
{
  const plane = (w, h) => new THREE.PlaneGeometry(w, h);
  // Two crossed cards, leaned apart so the silhouette breaks; the vertical
  // ramp does for a tuft what gradeCanopy does for a crown — lit tips over
  // shadowed roots, mass instead of paper.
  const TUFT = gradeCanopy(mergeParts([
    {g: plane(0.125, 0.11), c: [1, 1, 1], p: [0, 0.052, 0], r: [0.10, 0, 0]},
    {g: plane(0.125, 0.11), c: [1, 1, 1], p: [0, 0.052, 0], r: [-0.07, Math.PI / 2, 0]},
  ]), 0.62, 1.22);
  const BUSH = gradeCanopy(mergeParts([
    {g: ico(0.075, 0), c: [1, 1, 1], p: [0, 0.058, 0], s: [1, 0.8, 1]},
    {g: ico(0.055, 0), c: [1, 1, 1], p: [0.05, 0.046, 0.03], s: [1, 0.75, 1]},
    {g: ico(0.05, 0), c: [1, 1, 1], p: [-0.045, 0.05, -0.03]},
  ]), 0.62, 1.12);
  // Three cards splayed at thirds: the droop is in the lean, and the ramp is
  // stronger because a fern is mostly its own shadow.
  const FERN = gradeCanopy(mergeParts([0, 1, 2].map(k => (
    {g: plane(0.085, 0.12), c: [1, 1, 1], p: [0, 0.05, 0],
     r: [0.55, k * 2.094, 0]}))), 0.52, 1.12);
  const SAPLING = gradeCanopy(mergeParts([
    {g: cyl(0.006, 0.011, 0.10, 4), c: C.woodD, p: [0, 0.05, 0]},
    {g: ico(0.05, 0), c: [1, 1, 1], p: [0, 0.135, 0], s: [1, 1.15, 1]},
  ]), 0.78, 1.10);

  // Placement, seeded like everything invented here. Densities are per cell
  // by biome — the same table the trees read, at one storey down: meadows
  // and shores get the cover, the wood floor gets a sparse dappled layer,
  // rock and desert get almost nothing.
  const GRASS_D = [11, 4, 20, 13, 2.2, 0.5];   // steppe, forest, valley, coast, mountain, desert
  const riverCell = new Set();
  for (const [x1, y1, x2, y2] of DATA.rivers) {
    riverCell.add(x1 * 1000 + y1); riverCell.add(x2 * 1000 + y2);
  }
  // Two clearings, two memories. Woody growth honours the full historical
  // clearing (a thicket does not stand where a camp ever was — same rule as
  // the trees); grass and ferns only avoid the tight core, because grass
  // grows back: a campsite abandoned five hundred years ago is a meadow,
  // and painting it bare would assert a scar the record does not.
  const clearedWoody = clearedCells();
  const clearedSoft = clearedCells(1);
  const cl = v => Math.max(0, Math.min(G - 1, v));
  // A "wood" for edge purposes is anywhere trees stand thick — the pine
  // slopes count, not just the broadleaf biome, or the mountain woods get
  // no understory at all.
  const woodAt = (x, y) => (VEG_BY_INDEX[DATA.biome[x][y]] || [0])[0] >= 1.8;
  const grass = [], bush = [], fern = [], sapling = [];
  for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) {
    if (DATA.water[x][y] || heightAt(x, y) < 0.05) continue;
    GROUND.cells.land++;
    if (riverCell.has(x * 1000 + y)) { GROUND.cells.river++; continue; }
    // Lived ground thins the grass, it does not erase it: a hard exclusion
    // pockmarked the map with bald circles wherever any camp had ever
    // stood — permanent scars the record never asserted. The per-tick wear
    // paint carries "someone lives here now"; the meadow carries on.
    const lived = clearedSoft.has(x * 1000 + y);
    if (lived) GROUND.cells.cleared++;
    const woodyOK = !clearedWoody.has(x * 1000 + y);
    // Landform steepness from the coarse heights, the same measure the rock
    // paint reads (grad 1.0 ≈ 45°) — the fine surface is locally steep
    // everywhere by construction, and gating on it repeats the scree
    // mistake documented above at the slope bake. Grass yields only where
    // the rock paint actually dominates (≈ grad 1.6), thinning on the way;
    // the understory follows the trees, which climb what they like.
    const grad = Math.hypot(
      bilinear(cellH, x + 0.5, y) - bilinear(cellH, x - 0.5, y),
      bilinear(cellH, x, y + 0.5) - bilinear(cellH, x, y - 0.5));
    const rocky = grad > 1.5;
    if (rocky) GROUND.cells.steep++; else GROUND.cells.planted++;
    const slopeThin = 1 - 0.6 * Math.min(1, Math.max(0, (grad - 0.9) / 0.6));
    const biome = DATA.biome[x][y];
    if (biome === 4 && DATA.elevation[x][y] > 650) continue;   // above the grass line
    // Moisture from the record's own geometry: taller, denser, greener cover
    // toward water, straw toward the dry interior.
    const m = 1 - Math.min(1, Math.max(0, (distWater[x][y] - 1) / 6));
    // Clumped, not sprinkled: a meadow is drifts of grass with breath
    // between them, and the drift lives at a lower frequency than the cell.
    const clump = 0.35 + 1.3 * fbm(x * 0.55, y * 0.55, NSEED + 8050);
    const d = rocky ? 0 : GRASS_D[biome] * (0.55 + 0.75 * m) * slopeThin * clump
                        * (lived ? 0.3 : 1);
    const whole = Math.floor(d);
    const n = whole + (hash2(x, y, NSEED + 8101) < d - whole ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const h1 = hash2(x * 3 + i, y * 17 + i, NSEED + 8211 + i);
      const h2 = hash2(x * 13 + i * 7, y * 5 + i, NSEED + 8307 + i);
      const h3 = hash2(x + i * 23, y + i * 11, NSEED + 8401 + i);
      grass.push({x: x + (h1 - 0.5) * 0.95, y: y + (h2 - 0.5) * 0.95,
                  s: (0.6 + h3 * 0.8) * (0.72 + 0.55 * m), rot: h1 * 6.283, m,
                  f: bilinear(forestGrid, x, y)});
    }
    // Understory. A wood's edge is where the light is: bushes sit on cells
    // that touch a wood without being it, saplings and ferns inside.
    const nearWood = !woodAt(x, y) &&
      (woodAt(cl(x + 1), y) || woodAt(cl(x - 1), y) ||
       woodAt(x, cl(y + 1)) || woodAt(x, cl(y - 1)));
    const bushD = nearWood ? 1.6 : (woodAt(x, y) ? 0.5 : biome === 2 ? 0.3 : 0);
    if (woodyOK && hash2(x, y, NSEED + 8501) < bushD) {
      const k = 1 + (hash2(x, y, NSEED + 8502) < bushD - 1 ? 1 : 0);
      for (let i = 0; i < k; i++) {
        const h1 = hash2(x * 7 + i, y * 3 + i, NSEED + 8513 + i);
        const h2 = hash2(x * 5 + i, y * 19 + i, NSEED + 8607 + i);
        bush.push({x: x + (h1 - 0.5) * 0.9, y: y + (h2 - 0.5) * 0.9,
                   s: 0.7 + h1 * 0.8, rot: h2 * 6.283, m});
      }
    }
    if (woodyOK && woodAt(x, y) && hash2(x, y, NSEED + 8701) < 0.5) {
      const h1 = hash2(x * 11, y * 7, NSEED + 8703);
      sapling.push({x: x + (h1 - 0.5) * 0.9,
                    y: y + (hash2(x, y, NSEED + 8704) - 0.5) * 0.9,
                    s: 0.7 + h1 * 0.7, rot: h1 * 6.283, m});
    }
    if ((biome === 1 || biome === 2) && distWater[x][y] < 3) {
      const fd = 0.4 + 1.6 * m;
      const fn = Math.floor(fd) + (hash2(x, y, NSEED + 8801) < fd % 1 ? 1 : 0);
      for (let i = 0; i < fn; i++) {
        const h1 = hash2(x * 9 + i, y * 13 + i, NSEED + 8811 + i);
        const h2 = hash2(x * 17 + i, y * 7 + i, NSEED + 8907 + i);
        fern.push({x: x + (h1 - 0.5) * 0.9, y: y + (h2 - 0.5) * 0.9,
                   s: 0.65 + h2 * 0.7, rot: h1 * 6.283, m});
      }
    }
  }

  // Seasonal palettes, authored as hex through THREE.Color (the colour-space
  // rule above), mixed in working space, only then written to the buffers.
  // Brighter than instinct says: a vertical card catches half the sun the
  // ground under it does, so a tuft authored at the terrain's own value
  // renders as litter — the palette compensates for the geometry.
  const hx = h => new THREE.Color(h);
  const GRASS_S = [0x9cc468, 0x8ab558, 0xc9ad62, 0xa89b78].map(hx);
  const GRASS_WET = hx(0x639e4c);
  const GRASS_SHADE = hx(0x2f4a28);
  const FERN_S = [0x559552, 0x48894e, 0xa08344, 0x807b64].map(hx);
  const _c = new THREE.Color();
  // Under canopy the floor paint is the lit-crown green, and a meadow-bright
  // tuft disappears into it — found by the harness's close-up, where 37
  // placed tufts rendered invisibly at frame centre. Forest grass shades
  // toward understory dark instead: contrast against the floor it stands on,
  // not against the meadow it isn't in.
  const grassPal = (season, t, out) =>
    out.copy(GRASS_S[season]).lerp(GRASS_WET, t.m * 0.45)
       .lerp(GRASS_SHADE, (t.f || 0) * 0.35);
  const fernPal = (season, t, out) => out.copy(FERN_S[season]);
  const leafPal = mul => (season, t, out) => {
    const b = LEAF.broad[season];
    out.setRGB(b[0] * mul, b[1] * mul, b[2] * mul);
  };

  // One builder for the four layers: the §7 instancing hazard is respected —
  // each patched material is used by exactly one InstancedMesh, and every
  // mesh sets instanceColor. The sway is the trees' own patch with a gain,
  // plus a flutter term: a blade turns in wind a bough only leans into.
  const v = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3(),
        e = new THREE.Euler(), m4 = new THREE.Matrix4();
  function coverLayer(geo, list, pal, gain, wSquash) {
    if (!list.length) return null;
    // The whisper of emissive is translucency, not glow: a backlit blade
    // transmits light where a Lambert card goes black, and dawn was turning
    // every meadow into dark confetti without it.
    const mat = new THREE.MeshLambertMaterial(
      {color: 0xffffff, vertexColors: true, side: THREE.DoubleSide,
       emissive: 0x161e0d, emissiveIntensity: 0.55});
    mat.onBeforeCompile = sh => {
      sh.uniforms.uWindT = WIND.uT; sh.uniforms.uWindG = WIND.uG;
      sh.vertexShader = "uniform float uWindT; uniform float uWindG;\n" +
        sh.vertexShader.replace("#include <begin_vertex>",
          `#include <begin_vertex>
           {
             float wph = instanceMatrix[3][0] * 2.1 + instanceMatrix[3][2] * 2.9;
             float wsw = sin(uWindT * 1.9 + wph) + 0.5 * sin(uWindT * 3.7 + wph * 1.3)
                       + 0.35 * sin(uWindT * 6.1 + wph * 3.1);
             float lift = max(0.0, position.y);
             transformed.x += wsw * uWindG * lift * ${gain.toFixed(1)};
             transformed.z += wsw * 0.6 * uWindG * lift * ${gain.toFixed(1)};
           }`);
    };
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    const full = new Float32Array(list.length * 16);
    const wint = wSquash < 1 ? new Float32Array(list.length * 16) : null;
    list.forEach((t, i) => {
      toWorld(t.x, t.y, v); v.y -= 0.006;
      e.set(0, t.rot, 0); q.setFromEuler(e);
      sc.set(t.s, t.s, t.s); m4.compose(v, q, sc); m4.toArray(full, i * 16);
      if (wint) {
        sc.set(t.s, t.s * wSquash, t.s);
        m4.compose(v, q, sc); m4.toArray(wint, i * 16);
      }
      mesh.setMatrixAt(i, new THREE.Matrix4().fromArray(full, i * 16));
    });
    const cols = [0, 1, 2, 3].map(season => {
      const arr = new Float32Array(list.length * 3);
      list.forEach((t, i) => {
        pal(season, t, _c);
        const j = 0.85 + hash2((t.x * 64) | 0, (t.y * 64) | 0, NSEED + 8990) * 0.42;
        arr[i * 3] = Math.min(1, _c.r * j);
        arr[i * 3 + 1] = Math.min(1, _c.g * j);
        arr[i * 3 + 2] = Math.min(1, _c.b * j);
      });
      return arr;
    });
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cols[0]), 3);
    mesh.receiveShadow = true; mesh.frustumCulled = false;
    scene.add(mesh);
    groundCover.layers.push({mesh, cols, full, wint});
    return mesh;
  }
  coverLayer(TUFT, grass, grassPal, 5.0, 0.72);
  coverLayer(BUSH, bush, leafPal(0.85), 1.2, 1);
  coverLayer(FERN, fern, fernPal, 3.0, 0.55);
  coverLayer(SAPLING, sapling, leafPal(1.0), 2.0, 1);
  GROUND.grass = grass.length; GROUND.bush = bush.length;
  GROUND.fern = fern.length; GROUND.sapling = sapling.length;

  // Specks (§2): seed-heads over the summer and autumn meadows, snow-dust on
  // the winter understory — unlit points, one draw call each, reading at
  // exactly the distance the tufts below them stop.
  const heads = grass.filter((t, i) =>
    t.m < 0.85 && hash2(i, 1, NSEED + 9101) < 0.16);
  const hxyz = new Float32Array(heads.length * 3);
  heads.forEach((t, i) => {
    toWorld(t.x, t.y, v);
    hxyz[i * 3] = v.x; hxyz[i * 3 + 1] = v.y + 0.135 * t.s + 0.012;
    hxyz[i * 3 + 2] = v.z;
  });
  const headGeo = new THREE.BufferGeometry();
  headGeo.setAttribute("position", new THREE.BufferAttribute(hxyz, 3));
  groundCover.seedheads = new THREE.Points(headGeo, new THREE.PointsMaterial(
    {color: 0xd9cfa0, size: 0.028, sizeAttenuation: true,
     transparent: true, opacity: 0, depthWrite: false}));
  groundCover.seedheads.visible = false;
  scene.add(groundCover.seedheads);
  const dust = bush.filter((t, i) => hash2(i, 2, NSEED + 9201) < 0.6);
  const dxyz = new Float32Array(dust.length * 3);
  dust.forEach((t, i) => {
    toWorld(t.x, t.y, v);
    dxyz[i * 3] = v.x; dxyz[i * 3 + 1] = v.y + 0.085 * t.s + 0.01;
    dxyz[i * 3 + 2] = v.z;
  });
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(dxyz, 3));
  groundCover.snowdust = new THREE.Points(dustGeo, new THREE.PointsMaterial(
    {color: 0xeef2f8, size: 0.03, sizeAttenuation: true,
     transparent: true, opacity: 0, depthWrite: false}));
  groundCover.snowdust.visible = false;
  scene.add(groundCover.snowdust);
}

function updateGroundCover(tick) {
  const season = tick % 4;
  const sh = groundCover.seedheads, sd = groundCover.snowdust;
  sh.material.opacity = season === 1 ? 0.4 : season === 2 ? 0.75 : 0;
  sh.visible = sh.material.opacity > 0.01;
  const sev = winterSeverity(tick);
  sd.material.opacity = season === 3 ? 0.3 + 0.6 * sev : 0;
  sd.visible = sd.material.opacity > 0.01;
  if (season === groundCover.season) return;
  groundCover.season = season;
  for (const l of groundCover.layers) {
    l.mesh.instanceColor.array.set(l.cols[season]);
    l.mesh.instanceColor.needsUpdate = true;
    if (l.wint) {
      l.mesh.instanceMatrix.array.set(season === 3 ? l.wint : l.full);
      l.mesh.instanceMatrix.needsUpdate = true;
    }
  }
}

// ---- LOD bubble band (§2): people are statistics until the camera is close --
// Individuals instantiate lazily near the lens — the sim's own person model.
const peopleGroups = new Map();
function updatePeople() {
  for (const [cid, g] of groups) {
    if (!g.anchor) continue;
    toWorld(g.anchor[0], g.anchor[1], v3);
    const near = camera.position.distanceTo(v3) < G * 0.33;
    const have = peopleGroups.has(cid);
    if (near && !have) {
      const pg = new THREE.Group();
      const r = mulberry32((DATA.seed * 13 ^ +cid * 389) | 0);
      const mat = new THREE.MeshLambertMaterial({color: colorOf(+cid, 0.62)});
      for (let i = 0; i < 7; i++) {
        const m = new THREE.Mesh(GEO.person, mat);
        toWorld(g.anchor[0] + (r() - 0.5) * 1.6, g.anchor[1] + (r() - 0.5) * 1.6, m.position);
        m.position.y += 0.05;
        pg.add(m);
      }
      scene.add(pg); peopleGroups.set(cid, pg);
    } else if (!near && have) {
      scene.remove(peopleGroups.get(cid)); peopleGroups.delete(cid);
    }
  }
  for (const [cid, pg] of peopleGroups)
    if (!groups.has(cid)) { scene.remove(pg); peopleGroups.delete(cid); }
}

// ---- the moving world: defection walks and feast fires (§4) -----------------
// Defections are families walking a hospitality route; feasts are the
// boundary softening — both rendered from the journal's own flow/feast
// records, positions interpolated between the two peoples' anchors. Pools
// are reused every frame, so seeking is free and deterministic.
MAT.fire = new THREE.MeshLambertMaterial(
  {color: 0xd96f2b, emissive: 0xc75c14, emissiveIntensity: 1.7});
const WALK = 24, FEAST_GLOW = 8;
const anchorOf = (cid, tick) => { const s = sitesOf(cid, tick); return s && s.anchor; };
const walkerPool = [];
for (let i = 0; i < 36; i++) {
  const m = new THREE.Mesh(GEO.person, new THREE.MeshLambertMaterial({color: 0xffffff}));
  m.visible = false; scene.add(m); walkerPool.push(m);
}
// Every boat is somebody's boat: a hull carrying families or gifts across a
// shared water. Water was contact infrastructure in the sim before it was
// scenery here, so a crossing must read as a crossing.
const boatPool = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(GEO.boat,
    new THREE.MeshLambertMaterial({color: 0xffffff, vertexColors: true}));
  m.rotation.x = Math.PI / 2;
  m.visible = false; scene.add(m); boatPool.push(m);
}
// Landings: where a people's own ground meets its water. The record says a
// people is waterside (its anchor is chosen shoreward, and its home feature is
// named); the jetty is elaboration on top of that fact, deterministic and
// evidence-free — it decorates a shore the record already asserts.
const jettyGroup = new THREE.Group();
scene.add(jettyGroup);
let jettyVer = -2;
function updateLandings(tick) {
  if (jettyVer === appliedTo) return;
  jettyVer = appliedTo;
  jettyGroup.clear();
  const own = ownerAt(tick), sh = shoresAt(tick);
  for (const cid of Object.keys(sh)) {
    const site = sitesOf(+cid, tick);
    if (!site) continue;
    const [ax, ay] = site.anchor;
    // nearest water cell to the anchor, then a jetty reaching into it
    let bx = null, by = null, best = 9e9;
    for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) {
      if (!DATA.water[x][y]) continue;
      const d = (x - ax) ** 2 + (y - ay) ** 2;
      if (d < best) { best = d; bx = x; by = y; }
    }
    if (bx === null || best > 9) continue;   // not truly waterside
    const m = new THREE.Mesh(GEO.jetty, MAT.wood);
    const mx = ax + (bx - ax) * 0.55, my = ay + (by - ay) * 0.55;
    toWorld(mx, my, m.position);
    m.position.y = 0.02;
    m.rotation.y = Math.atan2(by - ay, bx - ax);
    jettyGroup.add(m);
  }
}
const firePool = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(
    bake(new THREE.CylinderGeometry(0.07, 0.09, 0.04, 6), C.woodD), MAT.wood));
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 5), MAT.fire);
  flame.position.y = 0.12; g.add(flame);
  const light = new THREE.PointLight(0xff9040, 1.6, 3.5);
  light.position.y = 0.3; g.add(light);
  g.visible = false; scene.add(g); firePool.push(g);
}
// ---- hearth-light and smoke: a settlement is awake --------------------------
// Neither is an event. The glow and the column say only "people are here,
// keeping fire", which the record already asserts by the settlement standing
// at all — ambience of the same standing as the trees. Smoke thins at night
// (you see the fire instead) and never rises from an unattested mound.
const SMOKE_WIND = [0.75, 0.35];          // the prevailing wind, xz
const smokePuffs = [];
for (let i = 0; i < 48; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial(
    {map: smokeTex, color: 0x9d9a90, transparent: true, opacity: 0,
     depthWrite: false}));
  sp.visible = false; scene.add(sp); smokePuffs.push(sp);
}
function updateHearthlight(now) {
  const nightF = 1 - curDayness;
  MAT.ember.emissiveIntensity = 1 + nightF * 3.1;   // beds glow against the dark
  let e = 0;
  for (const [cid, g] of groups) {
    for (const [, slot] of g.slots) {
      if (!slot.glow || !slot.mesh.visible) continue;
      slot.glow.material.opacity = nightF *
        (0.42 + 0.30 * Math.abs(Math.sin(now * 0.011 + slot.phase))
              + 0.12 * Math.abs(Math.sin(now * 0.031 + slot.phase * 1.7)));
    }
    if (g.anchor && g.matKey !== "0" && e + 3 <= smokePuffs.length) {
      const wy = Math.max(0, groundY(g.anchor[0], g.anchor[1])) + 0.42;
      for (let j = 0; j < 3; j++) {
        const sp = smokePuffs[e++];
        const phase = hash2(+cid, j, NSEED + 6500);
        const u = (now * 0.000055 * (1 + j * 0.18) + phase) % 1;
        const sway = Math.sin(now * 0.0006 + phase * 9) * 0.08 * u;
        sp.position.set(
          g.anchor[0] - G / 2 + SMOKE_WIND[0] * u * 1.1 + sway,
          wy + u * 1.15,
          g.anchor[1] - G / 2 + SMOKE_WIND[1] * u * 1.1 + sway * 0.6);
        sp.scale.setScalar(0.16 + u * 0.55);
        sp.material.opacity = Math.sin(Math.PI * u) * 0.15 * (0.3 + 0.7 * curDayness);
        sp.visible = true;
      }
    }
  }
  for (; e < smokePuffs.length; e++) smokePuffs[e].visible = false;
}

// ---- hard winters: the one weather the record asserts -----------------------
// VIEWER.md §1: weather is not recorded, so the viewer renders season plus
// hard_winter events and nothing finer. This is that second half. While a
// recorded hard winter grips, snow falls, the horizon closes in, and the
// light goes pale and flat (applied where the hour is set, below).
const hardWinters = new Map();   // winter tick -> cultures hit
for (const e of (DATA.events2 || []))
  if (e.type === "hard_winter")
    hardWinters.set(e.tick, (hardWinters.get(e.tick) || 0) + 1);
function winterSeverity(t) {
  // A hard_winter event is per-culture (a people's wellbeing broke in the
  // cold), and most winters hit someone — so the storm is graded by the share
  // of the living hit that season. One camp's bad winter is their dossier's
  // news; a third of the world hungry at once is weather you can see.
  let s = 0;
  for (const [et, n] of hardWinters) {
    const d = Math.abs(t - et);
    if (d >= 2) continue;
    const frac = n / Math.max(1, Object.keys(summaryAt(et).c).length);
    s = Math.max(s, Math.max(0, (frac - 0.3) / 0.35) * (1 - d / 2));
  }
  return Math.min(1, s);
}
const SNOW_N = 700, SNOW_BOX = G * 0.7;
const snowGeo = new THREE.BufferGeometry();
{
  const xyz = new Float32Array(SNOW_N * 3);
  for (let i = 0; i < SNOW_N; i++) {
    xyz[i * 3] = (hash2(i, 1, NSEED + 6601) - 0.5) * SNOW_BOX;
    xyz[i * 3 + 1] = hash2(i, 2, NSEED + 6602) * 8;
    xyz[i * 3 + 2] = (hash2(i, 3, NSEED + 6603) - 0.5) * SNOW_BOX;
  }
  snowGeo.setAttribute("position", new THREE.BufferAttribute(xyz, 3));
}
const snowfall = new THREE.Points(snowGeo, new THREE.PointsMaterial(
  {color: 0xe8ecf2, size: 0.055, sizeAttenuation: true,
   transparent: true, opacity: 0, depthWrite: false}));
snowfall.visible = false;
scene.add(snowfall);
const FOG_NEAR = scene.fog.near, FOG_FAR = scene.fog.far;
function updateWinter(t, now) {
  const sev = winterSeverity(t);
  snowfall.visible = sev > 0.02;
  if (!snowfall.visible) {
    if (scene.fog.near !== FOG_NEAR) { scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR; }
    return;
  }
  // The storm centres on the camera: the cloud travels with the view.
  snowfall.position.set(camera.position.x, 0, camera.position.z);
  const p = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_N; i++) {
    let y = p.array[i * 3 + 1] - 0.028 - (i % 5) * 0.004;
    if (y < 0) y += 8;
    p.array[i * 3 + 1] = y;
    p.array[i * 3] += Math.sin(now * 0.0011 + i) * 0.004;
  }
  p.needsUpdate = true;
  snowfall.material.opacity = sev * 0.9;
  scene.fog.near = FOG_NEAR + (G * 0.25 - FOG_NEAR) * sev;
  scene.fog.far = FOG_FAR + (G * 1.5 - FOG_FAR) * sev;
}

// ---- fireflies: summer nights over the wet ground ----------------------------
// Biome elaboration, same standing as the trees: they say nothing about
// anybody. Twinkle is per-point brightness, so it stays one draw call.
const FF_N = 140;
const fireflyGeo = new THREE.BufferGeometry();
{
  const xyz = new Float32Array(FF_N * 3), cols = new Float32Array(FF_N * 3);
  let placed = 0, tries = 0;
  while (placed < FF_N && tries++ < 4000) {
    const x = Math.floor(hash2(tries, 1, NSEED + 6701) * G);
    const y = Math.floor(hash2(tries, 2, NSEED + 6702) * G);
    if (DATA.water[x][y]) continue;

scene.add(fireflies);
function updateFireflies(now) {
  const on = (Math.floor(curTick) % 4 === 1) ? (1 - curDayness) : 0;
  fireflies.visible = on > 0.05;

  const c = fireflyGeo.attributes.color;
  for (let i = 0; i < FF_N; i++) {

const va = new THREE.Vector3(), vb = new THREE.Vector3();

function updateMotion(t, now) {
  const tick = Math.floor(t);

  let wi = 0, fi = 0, bi = 0;
  for (const f of DATA.flows) {
    if (f.tick > tick) break;
    if (f.tick + WALK <= t || wi >= walkerPool.length) continue;
    const A = anchorOf(f.from, tick), B = anchorOf(f.to, tick);
    if (!A || !B) continue;
    const u = (t - f.tick) / WALK;
    const body = sharedBody(f.from, f.to, tick);
    if (body !== null) {
      const P = shorePoint(f.from, body, tick), Q = shorePoint(f.to, body, tick);
      const C = bodyCentre(body);
      if (P && Q && C && bi < boatPool.length) {   // they go by water
        const m = boatPool[bi++];
        const uu = Math.max(0, Math.min(1, u));
        // quadratic bow through the body's centre keeps the hull off the shore
        const w = (1 - uu) * (1 - uu), mid = 2 * (1 - uu) * uu, e = uu * uu;
        const x = w * P[0] + mid * C[0] + e * Q[0];
        const y = w * P[1] + mid * C[1] + e * Q[1];
        const dx = 2 * (1 - uu) * (C[0] - P[0]) + 2 * uu * (Q[0] - C[0]);
        const dy = 2 * (1 - uu) * (C[1] - P[1]) + 2 * uu * (Q[1] - C[1]);
        m.position.set(x - G / 2, 0.03 + Math.sin(t * 3 + f.from) * 0.012, y - G / 2);
        m.rotation.z = -Math.atan2(dy, dx);
        m.material.color.copy(colorOf(f.from, 0.6));
        m.visible = true;
      }

    }
    for (let j = 0; j < Math.min(f.n, 3) && wi < walkerPool.length; j++) {
      const m = walkerPool[wi++];
      const uu = Math.max(0, Math.min(1, u - j * 0.05));
      const x = A[0] + (B[0] - A[0]) * uu, y = A[1] + (B[1] - A[1]) * uu;
      toWorld(x + Math.sin(uu * 9 + j) * 0.15, y + Math.cos(uu * 7 + j) * 0.15, m.position);
      m.position.y += 0.05;
      m.material.color.copy(colorOf(f.from, 0.6));
      m.visible = true;

    if (f.tick > tick) break;

  if (beatFire) lit.push(beatFire);
  for (const [a, b] of lit.slice(-firePool.length)) {
    const A = anchorOf(a, tick), B = anchorOf(b, tick);
    if (!A || !B) continue;
    const g = firePool[fi++];
    toWorld((A[0] + B[0]) / 2, (A[1] + B[1]) / 2, g.position);
    g.position.y += 0.03;
    g.children[1].scale.setScalar(0.85 + 0.3 * Math.abs(Math.sin(now * 0.011)));

  for (; bi < boatPool.length; bi++) boatPool[bi].visible = false;
  for (; fi < firePool.length; fi++) firePool[fi].visible = false;
}

// ---- the margins: chronicle attrition as ambience (§4) ----------------------

const marginsEl = document.getElementById("margins");
const margins = DATA.margins.slice().sort((a, b) => a.tick - b.tick);

function updateMargins(tick) {

// ---- camera: spring-damper rig with curved altitude path (§2) ---------------
const cam = {
  focus: new THREE.Vector3(0, 0, 0), fTarget: new THREE.Vector3(0, 0, 0),
  yaw: 0.8, pitch: 0.6, dist: G * 0.85, dTarget: G * 0.85, vel: new THREE.Vector3(),
  pTarget: null,   // director-set pitch; released to the viewer on drag
};
// ---- wander mode: be in the world, not above it ------------------------------
// The camera is the viewer's only presence here, and walking it touches
// nothing (§5). A slow glide at eye height over the surface actually drawn —
// the detail mesh, the rivers, the shores all repay the close reading they
// were built for. `w` toggles; drag steers; the wheel is pace; WASD walks,
// the letters yielding their other duties (dig, sound, wander) for as long
// as the walk lasts. Escape leaves.
let wander = null;   // {x, z, heading, pitch, speed, y}
const walkKeys = new Set();
function setWander(on) {
  document.getElementById("wander").classList.toggle("on", !!on);
  cancelFlight();
  walkKeys.clear();
  if (on) {
    const dir = v3.copy(cam.fTarget).sub(camera.position);
    // The gaze carries over: entering the walk from an orbit that looked
    // down keeps looking down — flattening it to the horizon hid the whole
    // bottom storey (GAP §2) from the one mode built to stand in it.
    wander = {x: camera.position.x, z: camera.position.z,
              heading: Math.atan2(dir.z, dir.x),
              pitch: Math.min(0.5, Math.max(0, cam.pitch * 0.45)), speed: 1.6,
              y: Math.max(0.02, heightField(camera.position.x + G / 2,
                                            camera.position.z + G / 2)) + 0.55};
  } else {
    // Hand the orbit rig back where the walk ended, looking the same way.
    if (wander) {
      cam.fTarget.set(wander.x + Math.cos(wander.heading) * G * 0.1, 0,
                      wander.z + Math.sin(wander.heading) * G * 0.1);
      cam.focus.copy(cam.fTarget); cam.vel.set(0, 0, 0);
      cam.dTarget = G * 0.3; cam.pTarget = null;

  }
}
function camStep(dt) {
  if (wander) {
    const w = wander;

    // still goes somewhere. Keys take over: A/D turn, W/S drive and rein.
    if (walkKeys.size) {
      if (walkKeys.has("KeyA")) w.heading += dt * 2.2;
      if (walkKeys.has("KeyD")) w.heading -= dt * 2.2;
    } else {
      w.heading += (fbm(w.x * 0.13 + 31.7, w.z * 0.13 + 7.1, NSEED + 6100) - 0.5) * dt * 0.6;
    }
    const drive = walkKeys.has("KeyW") ? 1 : walkKeys.has("KeyS") ? -0.6
                : walkKeys.size ? 0 : 1;
    let nx = w.x + Math.cos(w.heading) * w.speed * drive * dt;
    let nz = w.z + Math.sin(w.heading) * w.speed * drive * dt;
    const lim = G / 2 - 1;
    if (Math.abs(nx) > lim || Math.abs(nz) > lim) {   // the world's edge turns you
      w.heading += Math.PI * 0.5;
      nx = Math.max(-lim, Math.min(lim, nx));
      nz = Math.max(-lim, Math.min(lim, nz));
    }
    // Trunks are solid: slide around the bole rather than through it.
    for (const t of treesNear(nx, nz, 0.6)) {
      const rr = 0.10 + t.s * 0.05, d = Math.hypot(nx - t.wx, nz - t.wz);

        nz = t.wz + (nz - t.wz) / d * rr;
      }
    }
    w.x = nx; w.z = nz;
    const gy = Math.max(0.02, heightField(w.x + G / 2, w.z + G / 2)) + 0.55;
    w.y += (gy - w.y) * Math.min(1, dt * 4);
    camera.position.set(w.x, w.y, w.z);
    const lx = w.x + Math.cos(w.heading) * 2.2, lz = w.z + Math.sin(w.heading) * 2.2;

    camera.lookAt(lx, ly, lz);

    cam.dist = flight.d0 + (flight.d1 - flight.d0) * e;
    cam.pitch = flight.q0 + (flight.q1 - flight.q0) * e;
    cam.vel.set(0, 0, 0);

    const alt = cam.dist * (1 + 0.7 * arc * Math.sin(Math.PI * e));
    camera.position.set(
      cam.focus.x + Math.cos(cam.yaw) * Math.cos(cam.pitch) * alt,
      cam.focus.y + Math.sin(cam.pitch) * alt,
      cam.focus.z + Math.sin(cam.yaw) * Math.cos(cam.pitch) * alt);
    camera.lookAt(cam.focus);
    if (flight.u >= 1) flight = null;

  const k = 3.2, d = 2 * Math.sqrt(k);

    .addScaledVector(cam.vel, -d);

  cam.focus.addScaledVector(cam.vel, dt);
  cam.dist += (cam.dTarget - cam.dist) * Math.min(1, dt * 3);
  if (cam.pTarget !== null)
    cam.pitch += (cam.pTarget - cam.pitch) * Math.min(1, dt * 2.5);
  const rem = Math.min(1, cam.fTarget.distanceTo(cam.focus) / (G * 0.4));

    cam.focus.x + Math.cos(cam.yaw) * Math.cos(cam.pitch) * alt,
    cam.focus.y + Math.sin(cam.pitch) * alt,
    cam.focus.z + Math.sin(cam.yaw) * Math.cos(cam.pitch) * alt);

}
// Shot grammar (§4): each beat kind gets its own framing. The ratchet is an
// overhead — the assembly that fails to disperse reads in plan view; the
// liberation is low and close; the schism is wide enough to hold both camps.
// The pitches are biased low throughout: a world filmed across reads as a
// place, a world filmed from above reads as a model of one.
// ---- flights: interpolated paths between beats ------------------------------
// The spring rig is good at holding a shot and poor at going to one: its
// speed is whatever the remaining distance says, and pitch and distance
// arrive on their own clocks, so a directed framing used to compose
// piecemeal. A directed move is flown instead as one planned path — focus,
// distance and pitch eased together over a duration the path length sets,
// with the altitude arc planned in rather than falling out of the spring.
// Long moves still cut (the ANNALS rig's rule against airline tours), and
// any touch of the controls cancels the flight mid-air: the viewer's drag

function cancelFlight() { flight = null; }
const SHOTS = {fusion: {d: 0.20, p: 0.45}, ratchet: {d: 0.30, p: 1.28},

               schism: {d: 0.55, p: 0.68}, extinction: {d: 0.45, p: 0.8},
               encounter: {d: 0.22, p: 0.48}, succession: {d: 0.24, p: 0.55}};

  const len = cam.fTarget.distanceTo(cam.focus);
  if (len > G * 0.9 && !hold) {   // cut, don't tour

    cam.focus.copy(cam.fTarget).add(v3.set(G * 0.06, 0, G * 0.06));
    cam.vel.set(0, 0, 0);

  }

let dragging = false, px = 0, py = 0;
stage.addEventListener("pointerdown", e => { cancelFlight(); dragging = true; px = e.clientX; py = e.clientY; }, sig);
addEventListener("pointerup", () => dragging = false, sig);
addEventListener("pointermove", e => {
  if (!dragging) return;
  if (wander) {
    wander.heading -= (e.clientX - px) * 0.004;
    wander.pitch = Math.min(0.7, Math.max(-0.4, wander.pitch + (e.clientY - py) * 0.003));
    px = e.clientX; py = e.clientY;
    return;
  }
  cam.pTarget = null;   // the viewer took the wheel
  cam.yaw += (e.clientX - px) * 0.005;
  cam.pitch = Math.min(1.35, Math.max(0.25, cam.pitch + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY;
}, sig);
stage.addEventListener("wheel", e => {
  cancelFlight();
  if (wander) {
    wander.speed = Math.min(6, Math.max(0.3, wander.speed * (1 - e.deltaY * 0.001)));
    return;
  }
  cam.dTarget = Math.min(G * 2.2, Math.max(G * 0.12, cam.dTarget * (1 + e.deltaY * 0.001)));
}, {passive: true, signal: ctl.signal});

// ---- sound: ambience of the world's standing, never a score -----------------
// Every layer is something already drawn, heard: wind that strengthens with
// altitude and with recorded storms, water where the view nears a shore,
// hearth-crackle near a living camp after dark — and nothing else. No
// melody, no sting on a beat: the film quotes its sources and the mix has
// none. The noise bed is mulberry32(NSEED), so the same bundle roars the
// same way, and the crackle is hash2 over time quanta — the fireflies'
// trick in another medium. Off until asked (`s`): a record should open
// silent, and the browser would refuse a gestureless start anyway.
let audioOn = false, audio = null;
function setSound(on) {
  document.getElementById("sound").classList.toggle("on", on);
  if (on && !audio) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Two seconds of pinkish noise from the seed: white through a leaky
    // integrator, the cheapest spectrum that does not hiss.
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const rnd = mulberry32(NSEED ^ 0x9e3779b9), ch = buf.getChannelData(0);
    let acc = 0;
    for (let i = 0; i < len; i++) { acc = acc * 0.97 + (rnd() * 2 - 1) * 0.03; ch[i] = acc * 7; }
    const master = ctx.createGain();
    master.gain.value = 0; master.connect(ctx.destination);
    const layer = (type, freq, q) => {
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.playbackRate.value = 0.85 + rnd() * 0.3;   // the layers never beat in phase
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(master); src.start();
      return {f, g};
    };
    audio = {ctx, master,
             wind: layer("lowpass", 380, 0.5),
             water: layer("bandpass", 750, 0.9),
             fire: layer("highpass", 2600, 0.4)};
  }
  if (audio) {
    if (on && audio.ctx.state === "suspended") audio.ctx.resume();
    audio.master.gain.setTargetAtTime(on ? 0.55 : 0, audio.ctx.currentTime, 0.5);
  }
  audioOn = on;
}
// Proximity is the mix, so it is measured on the world, throttled: nearest
// water cell to the point under the view, nearest lit hearth to the camera.
let nearWater = 0, nearHearth = 0, nearAt = -1;
function measureNear(now) {
  if (now - nearAt < 300) return;
  nearAt = now;
  const px = wander ? wander.x : cam.focus.x, pz = wander ? wander.z : cam.focus.z;
  const cx = Math.round(px + G / 2), cy = Math.round(pz + G / 2);
  let best = 8;
  for (let dx = -7; dx <= 7; dx++) for (let dy = -7; dy <= 7; dy++) {
    const x = cx + dx, y = cy + dy;
    if (x < 0 || y < 0 || x >= G || y >= G) continue;
    if (DATA.water && DATA.water[x] && DATA.water[x][y])
      best = Math.min(best, Math.max(Math.abs(dx), Math.abs(dy)));
  }
  nearWater = best > 7 ? 0 : 1 - best / 8;
  let hd = Infinity;
  for (const [, g] of groups) for (const [, s] of g.slots)
    if (s.glow && s.mesh.visible) {
      const d = camera.position.distanceTo(s.mesh.position);
      if (d < hd) hd = d;
    }
  nearHearth = hd === Infinity ? 0 : Math.max(0, 1 - hd / (G * 0.09));
}
function soundStep(now) {
  if (!audio || !audioOn) return;
  measureNear(now);
  const t = audio.ctx.currentTime;
  const sev = winterSeverity(curTick);
  // Wind is altitude and storm: high flight hears more of it, and a recorded
  // hard winter opens the filter up. Walking hears less of it than flying.
  const alt = wander ? 0.25 : Math.min(1, cam.dist / (G * 1.1));
  audio.wind.g.gain.setTargetAtTime(0.05 + 0.10 * alt + 0.28 * sev, t, 0.6);
  audio.wind.f.frequency.setTargetAtTime(380 + 900 * sev, t, 0.8);
  // Water swells slowly where a shore is near; none inland, none at altitude
  // unless the shore is all there is.
  const swell = 0.75 + 0.25 * Math.sin(now * 0.0009);
  audio.water.g.gain.setTargetAtTime(nearWater * 0.09 * swell * (0.4 + 0.6 * alt), t, 0.5);
  // Hearth-crackle after dark, set per frame: the pops are 90ms quanta of a
  // hash, so the pattern is fixed for a given wall-clock moment and owes
  // nothing to a dice roll.
  const night = 1 - curDayness;
  const c = hash2(Math.floor(now / 90), 7, NSEED + 7700);
  const pop = c > 0.68 ? (c - 0.68) * 3.4 : 0;
  audio.fire.g.gain.value = nearHearth * night * (0.012 + pop * 0.12);
}

// ---- the director: this camera flies to arguments (§4) ----------------------
// Beats from events + verbatim deliberations; priority bus with a cooldown.
// [SCAFFOLD] one shot type (fly + card). Handoff non-events, defection walks,
// regalia at fusion, and chronicle-attrition ambience are TODO.
const PRIORITY = {fusion: 9, ratchet: 8, unfusion: 7, liberation: 7, schism: 6,
                  hardening: 5, ratchet_crisis: 5, recovery: 4, contradiction: 3,
                  encounter: 2, extinction: 6, succession: 2};
// The gloss a beat falls back to when no chronicle entry survives for it.
const GLOSSES = {
  succession: "The handoff: power dissolving on schedule — the recurring " +
              "non-event. The chief steps down as the ice breaks.",
  ratchet: "The assembly that fails to disperse: the spring disassembly " +
           "never comes.",
  unfusion: "The regalia are abandoned where they fell.",
  fusion: "Regalia appear; the frontier begins to read like a line.",
};
const beats = [];
for (const e of DATA.events2 || DATA.events) {
  let quote = e.note || null;
  if (e.type === "ratchet" && e.structure)
    quote = `The ${e.structure.replace(/_/g, " ")} no longer dissolves; ` +
            `the ${(e.displaced || "seasonal way").replace(/_/g, " ")} is displaced.`;
  beats.push({tick: e.tick, kind: e.type, culture: e.culture, quote,
              mechanism: e.mechanism});
}
for (const d of DATA.deliberations)
  beats.push({tick: d.tick, kind: d.kind, culture: d.culture, quote: d.text,
              speaker: d.speaker, stance: d.stance, model: d.model,
              other: d.other});
beats.sort((a, b) => a.tick - b.tick || (PRIORITY[b.kind] || 0) - (PRIORITY[a.kind] || 0));
// The scrubber carries the history's shape: one notch per structural beat, so
// the run's skeleton is visible before it is played.
{
  const marksEl = document.getElementById("marks");
  const KIND_COL = {fusion: "#c9a227", ratchet: "#2e2417", unfusion: "#b0623a",
                    liberation: "#5a7248", schism: "#7a5a8a", extinction: "#4a4a4a",
                    hardening: "#8a6a3a"};
  for (const b of beats) {
    if ((PRIORITY[b.kind] || 0) < 5) continue;
    const i = document.createElement("i");
    i.style.left = (b.tick / (T - 1) * 100) + "%";
    i.style.background = KIND_COL[b.kind] || "#8a3324";
    i.title = `${b.kind.replace("_", " ")} · year ${Math.floor(b.tick / 4)}`;
    marksEl.appendChild(i);
  }
}
const chronMap = new Map();
for (const c of DATA.chronicle) {
  const k = `${c.tick}|${c.type}`;

}
const survivingChron = new Map();
for (const m of DATA.margins) {
  if (!m.surviving) continue;
  const k = `${m.tick}|${m.type}`;
  if (!survivingChron.has(k)) survivingChron.set(k, m);
}

const beatEl = document.getElementById("beat");
let beatPtr = 0, beatCool = 0, beatShownAt = 0;
function seekBeats(tick) {
  beatPtr = beats.findIndex(b => b.tick > tick);
  if (beatPtr < 0) beatPtr = beats.length;
  beatEl.classList.remove("on");
  beatFire = null;
}
let crownPulse = null;   // {cid, t0} — regalia announcing themselves at fusion
function directorStep(tick, now) {
  while (beatPtr < beats.length && beats[beatPtr].tick <= tick) {
    const b = beats[beatPtr++];
    const pri = PRIORITY[b.kind] || 0;
    // Cooldown by rank: rare structural beats interrupt; encounters and
    // successions only fill silence.
    if (pri < 2) continue;
    if (now < beatCool && pri < 6) continue;
    if (pri <= 2 && now < beatCool + 2500) continue;
    beatCool = now + 4500;
    beatShownAt = now;
    if (b.kind === "fusion" && b.culture != null)
      crownPulse = {cid: b.culture, t0: now};
    // The encounter shot: two delegations across a frontier fire — the
    // camera lands on the border midpoint, not either people's ground.
    if (b.kind === "encounter" && b.other != null && b.culture != null) {
      const A = anchorOf(b.culture, tick), B = anchorOf(b.other, tick);
      if (A && B) {
        toWorld((A[0] + B[0]) / 2, (A[1] + B[1]) / 2, cam.fTarget);
        frameShot("encounter");
        beatFire = [b.culture, b.other];
      }
    } else if (b.culture != null) flyTo(b.culture, tick, b.kind);
    const chron = chronMap.get(`${b.tick}|${b.kind}`);
    // Archaeologist mode: a deliberation is not evidence — what was said
    // reaches us only if some surviving chronicle recorded it. The film may
    // quote only the record, and must show the gap where there is none.
    const surv = survivingChron.get(`${b.tick}|${b.kind}`);
    const quote = archaeo
      ? (surv ? surv.text : "The record does not preserve what was said here.")
      : ((chron && chron.text) || b.quote || GLOSSES[b.kind]
         || "(the record is silent)");
    const who = archaeo
      ? (surv ? `${surv.author}, ${surv.medium} — survives` : "no surviving account")
      : (b.speaker
         ? `${b.speaker.name} of the ${b.speaker.culture} — ${(b.speaker.traits || []).join(", ")}`
         : chron ? `${chron.author}, ${chron.medium}` : "");
    document.getElementById("beat-kind").textContent =
      `${b.kind.replace("_", " ")} · year ${Math.floor(b.tick / 4)}` +
      (b.stance ? ` · settled toward ${b.stance}` : "") +
      (b.mechanism ? ` · by ${b.mechanism}` : "");
    document.getElementById("beat-quote").textContent = quote;
    document.getElementById("beat-cite").textContent =
      who + (b.model && !b.model.startsWith("stub") ? ` · argued live (${b.model})` : "");
    beatEl.classList.add("on");
  }
  if (beatEl.classList.contains("on") && now - beatShownAt > 9000) {
    beatEl.classList.remove("on");
    beatFire = null;
  }
  // Idle: with nothing to film for a while, pull back to the establishing
  // wide and drift — the land itself is the between-beats shot.
  if (playing && now - beatShownAt > 16000 && !dragging) {
    cam.dTarget = Math.max(cam.dTarget, G * 0.7);
    cam.pTarget = 0.68;
    cam.yaw += 0.0006;
  }
}

// ---- legend -----------------------------------------------------------------
// Struck-through means extinct; the not-yet-born are simply absent — the

const firstSeen = {};
for (const s of sums)
  for (const cid of Object.keys(s.c))
    if (!(cid in firstSeen)) firstSeen[cid] = s.tick;
const legendEl = document.getElementById("legend");

    const live = cid in sum.c;
    if (!live && (firstSeen[cid] === undefined || firstSeen[cid] > tick)) continue;
    const row = document.createElement("div");

// ---- time: play, scrub, seasons ---------------------------------------------
const scrubEl = document.getElementById("scrub"), playBtn = document.getElementById("play");
scrubEl.max = T - 1;
let curTick = 0, playing = false, tps = 3, lastPaint = -1, lastLegend = -1;
let lastEra = -1, eraTimer = 0;
function eraCard(era, tick) {
  const el = document.getElementById("eracard");
  const ORD = ["first", "second", "third", "fourth", "fifth", "sixth",
               "seventh", "eighth", "ninth", "tenth", "eleventh", "twelfth"];
  el.textContent = `the ${ORD[era] || ((era + 1) + "th")} era · year ${Math.floor(tick / 4)}`;
  el.classList.add("on");
  clearTimeout(eraTimer);
  eraTimer = setTimeout(() => el.classList.remove("on"), 3200);
}
function setTick(t, hard) {
  curTick = Math.max(0, Math.min(T - 1, t));
  scrubEl.value = Math.floor(curTick);
  const tick = Math.floor(curTick);
  document.getElementById("year").textContent = "year " + Math.floor(tick / 4);
  document.getElementById("season").textContent = SEASONS[tick % 4];
  // Eras announce themselves as they turn — only while the film rolls; a
  // scrub through time must not flash its chapter headings.
  const era = Math.floor(tick / (DATA.era_ticks || 80));
  if (era !== lastEra) {
    const prevEra = lastEra;
    lastEra = era;
    if (playing && prevEra >= 0) eraCard(era, tick);
  }
  if (hard) { seekBeats(tick); beatCool = 0; }
  if (tick !== lastPaint) {
    paintGround(tick); updateForest(tick); updateGroundCover(tick);
    lastPaint = tick;
  }
  if (Math.floor(tick / 20) !== lastLegend) {
    drawLegend(tick); lastLegend = Math.floor(tick / 20);
    if (dossierCid !== null) showDossier(dossierCid, tick);
  }
}
playBtn.addEventListener("click", () => { endOpening(); playing = !playing; playBtn.textContent = playing ? "pause" : "play"; }, sig);

// ---- archaeologist mode toggle ----------------------------------------------
const digBtn = document.getElementById("dig"), modeNote = document.getElementById("modenote");

  modeNote.classList.toggle("on", on);
  if (on) {
    const surv = DATA.margins.filter(m => m.surviving).length;

      `Mounds are peoples no surviving text attests; heraldry and regalia are ` +

document.getElementById("wander").addEventListener("click", () => setWander(!wander), sig);

document.getElementById("title").textContent =

// ---- main loop --------------------------------------------------------------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const lh = 0.036;
  for (const sp of labelGroup.children)
    sp.scale.set(lh * sp.userData.aspect / (w / h), lh, 1);

addEventListener("resize", resize, sig); resize();

let prev = performance.now();
let dwell = 1;   // the film's breathing: 1 at speed, 0.35 under a beat card
// ---- the opening: a held dawn and one slow flight in ------------------------
// A first-time visitor gets the world introduced: the title holds centre,
// the camera starts high and wide with the low sun in frame, and makes a
// single slow flight down to the first hearth the record holds. Time is
// still paused — tick 0 is dawn by the clock's own arithmetic — so the
// light waits with it. Deep links (#t, #play, #dig) skip the ceremony and
// land where they point; so does a reduced-motion preference, and any touch
// of the controls ends it early, the viewer's hand outranking ceremony too.
//
// Declared before the deep-link block below: #play clicks the play button,
// whose handler calls endOpening() — with the declaration after it, that
// click died in the let's dead zone and #play never actually started
// playback. The harness's per-shot reload (shots/capture.mjs) is what
// finally surfaced this.
let opening = false;
function endOpening() {
  if (!opening) return;
  opening = false;
  document.body.classList.remove("open");
}
// #t=1234&play seeks (and optionally starts) — a shareable moment.
const hash = new URLSearchParams(location.hash.slice(1));
setTick(+(hash.get("t") || 0), true);
if (hash.has("dig")) setArchaeo(true);
if (hash.has("play")) playBtn.click();
toWorld(G / 2, G / 2, cam.fTarget); cam.focus.copy(cam.fTarget);
if (!hash.has("t") && !hash.has("play") && !hash.has("dig") &&
    !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  opening = true;
  document.body.classList.add("open");
  cam.dist = cam.dTarget = G * 1.5;
  cam.pitch = cam.pTarget = 0.55;
  cam.yaw = Math.PI + 0.5;   // the tick-0 sun sits +x; put it in frame
  const first = +Object.keys(DATA.cultures)[0];
  const site = sitesOf(first, 0);
  if (site) toWorld(site.anchor[0], site.anchor[1], cam.fTarget);
  frameShot("succession", 8);   // low and close, flown slowly — forced, not cut
}
function frame(now) {
  if (ctl.signal.aborted) { composer.dispose(); renderer.dispose(); return; }
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (playing) {
    // Beat dwell: while a card is up the film breathes — time eases to a
    // third so the argument on screen can actually be read, then resumes.
    const dwellTo = beatEl.classList.contains("on") ? 0.35 : 1;
    dwell += (dwellTo - dwell) * Math.min(1, dt * 1.6);
    setTick(curTick + tps * dwell * dt, false);
    if (curTick >= T - 1) { playing = false; playBtn.textContent = "play"; }
  }
  if (!opening) directorStep(Math.floor(curTick), now);   // ceremony first
  if (opening && !flight) endOpening();   // landed, or waved off
  updateMotion(curTick, now);
  updateWater(now);
  updateMargins(Math.floor(curTick));
  // Day/night as a slow sun swing (§2) — ambience, not record. Driven from the
  // clock whether or not it is running: paused at tick N the world now shows
  // tick N's hour, so a still is reproducible from the bundle like everything
  // else here, instead of keeping whatever light the last frame left behind.
  {
    const season = Math.floor(curTick) % 4;
    // The year tilts: summer days run long and high, winter's short and low.
    // The season is the record's own, so the light may follow it — this is
    // season rendering, not invented weather.
    const DAYLEN = [1.0, 1.3, 1.0, 0.62], SUNALT = [0.85, 1.05, 0.9, 0.55];
    // One day spans 32 ticks: at 3 t/s a golden hour lingers long enough to
    // read as light rather than as a strobe. Still tick-derived, so a
    // paused frame's hour is reproducible from the bundle.
    const th = (curTick % 32) / 32 * Math.PI * 2;
    const dayness = Math.max(0, Math.min(1,
      0.5 + 0.5 * Math.sin(th) * DAYLEN[season]));
    curDayness = dayness;
    // Direction is all a directional light uses, so the position is pushed well
    // outside the world: at the old radius the shadow camera's near plane cut
    // through the terrain when the sun sat low.
    sun.position.set(Math.cos(th) * G * 0.6,
                     G * (0.18 + 0.45 * dayness * SUNALT[season]),
                     Math.sin(th) * G * 0.4)
       .normalize().multiplyScalar(G * 1.9);
    // Floors raised against the ACES toe (GAP §1): the curve buys its filmic
    // highlights by pressing hardest on exactly the range the nocturne and
    // the under-canopy shadows live in, so night light starts higher than it
    // did when the output was straight-through.
    sun.intensity = 1.25 + 1.6 * dayness;
    sun.color.copy(SUN_NIGHT).lerp(SUN_DAY, dayness);
    if (season === 3) sun.color.lerp(SUN_WINTER, 0.35 * dayness);
    // Night is a painted nocturne, not an unlit scene: the fill drops and goes
    // indigo, so silhouettes stay readable while the warmth leaves the land.
    skyFill.intensity = 0.42 + 0.55 * dayness;
    skyFill.color.copy(SKY_NIGHT).lerp(SKY_DAY, dayness);
    // Day-for-night: the eye opens in the dark, so the exposure does too.
    // Cubed, so the lift lives in true night and leaves dawn and dusk on
    // the base curve — the golden hours are the identity and stay graded
    // as authored.
    renderer.toneMappingExposure = 1.12 + 0.38 * Math.pow(1 - dayness, 3);
    updateSky(dayness);
    // A recorded hard winter flattens and pales whatever the hour set.
    const sev = winterSeverity(curTick);
    if (sev > 0.02) {
      sun.intensity *= 1 - 0.3 * sev;
      sun.color.lerp(SUN_WINTER, sev * 0.45);
      skyFill.intensity += 0.18 * sev;
    }
    // The storm signal, fanned out: what falls, what drifts, what sways.
    WIND.uT.value = now / 1000;
    WIND.uG.value = 0.02 + sev * 0.10;
    updateClouds(now, dt, dayness, sev);
    updateBirds(now, dayness);
  }
  updateHearthlight(now);
  updateWinter(curTick, now);
  updateFireflies(now);
  updateSettlements(curTick);
  camStep(dt);
  updateTreeFade();
  soundStep(now);
  updatePeople();
  grainPass.uniforms.uTime.value = now / 1000;
  composer.render(dt);

}
requestAnimationFrame(frame);

  archaeo: () => archaeo,
  // Seek to a fractional tick (the scrubber's power, finer) and read where a

  // Boat positions in grid coords, with the water flag under each hull: a

  boatCells: () => boatPool.filter(m => m.visible).map(m => {
    const x = Math.round(m.position.x + G / 2), y = Math.round(m.position.z + G / 2);
