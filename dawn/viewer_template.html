<!-- dawn viewer — the Phase 4 replay viewer (VIEWER.md), scaffold.

A replay client: this file consumes the run bundle baked into it and renders
a finished history. Journal → pixels; nothing here feeds back into the sim.
All invented geometry (site plans, tents, banners) is deterministic from
bundle + seed and evidence-free: it decorates what the record is silent
about and never contradicts it (the elaboration rule, VIEWER.md §0).

Three.js is vendored inline below (no CDN — offline use, artifact CSP, and
twenty-year replayability). Scaffold status per system is marked [SCAFFOLD]
where the full treatment in VIEWER.md §§2–4 is still to come. -->

<script type="module">
// Vendored modules, imported via blob so this file stays single and offline.
// The split r178 build's relative import is rewired to the core blob's URL.
const blobURL = (src) =>
  URL.createObjectURL(new Blob([src], {type: "text/javascript"}));
const coreURL = blobURL(document.getElementById("three-core-src").textContent);
const THREE = await import(blobURL(
  document.getElementById("three-src").textContent
    .replaceAll("./three.core.min.js", coreURL)));

// The whole app lives in boot(DATA) so a dropped bundle can replace the
// world: abort the old session's listeners and render loop, start anew.
let bootCtl = null;
function boot(DATA) {
  if (bootCtl) bootCtl.abort();
  const ctl = bootCtl = new AbortController();
  const sig = {signal: ctl.signal};
  document.getElementById("stage").replaceChildren();

// ---- shared conventions (identical to the 2D watch mode) --------------------
const SEASONS = ["spring", "summer", "autumn", "winter"];
const BIOME_TINT = [[214,205,159],[157,185,138],[181,203,150],
                    [169,196,206],[192,188,176],[228,215,174]];
// axes: 0 rank 1 display 2 nomadism 3 closed 4 accumulation 5 command 6 sacred 7 violence
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
function hueOf(cid) { return (cid * 137.508) % 360; }
function colorOf(cid, l = 0.5) {
  return new THREE.Color().setHSL(hueOf(cid) / 360, 0.5, l);
}

const G = DATA.grid, T = DATA.ticks;

// ---- territory reconstruction: owner0 + deltas ------------------------------
const deltas = DATA.deltas.slice().sort((a, b) => a.tick - b.tick);
let owner = null, appliedTo = -1;
function ownerAt(tick) {
  if (owner === null || tick < appliedTo) {
    owner = DATA.owner0.map(r => r.slice());
    appliedTo = -1;
  }
  for (const d of deltas) {
    if (d.tick > tick) break;
    if (d.tick <= appliedTo) continue;
    for (const [x, y] of d.cells) owner[x][y] = d.to;
  }
  appliedTo = tick;
  return owner;
}

// ---- summaries: the interpolation source (render/sim decoupling, §2) --------
const sums = DATA.summaries;
function summaryAt(tick) {
  let lo = 0, hi = sums.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1;
    if (sums[m].tick <= tick) lo = m; else hi = m - 1; }
  return sums[lo];
}

// ---- scene ------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191510);
scene.fog = new THREE.Fog(0x191510, G * 1.4, G * 3.2);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, G * 8);

const sun = new THREE.DirectionalLight(0xfff2dc, 2.6);
sun.position.set(G * 0.5, G * 0.7, G * 0.3);
scene.add(sun, new THREE.AmbientLight(0x8a7f6a, 1.1));

// Terrain: one vertex per cell; height from elevation (mils, rendering-only —
// it never drives culture, and it doesn't here either: pixels only).
const HEIGHT = 7.5;
const terrainGeo = new THREE.PlaneGeometry(G, G, G - 1, G - 1);
terrainGeo.rotateX(-Math.PI / 2);
const pos = terrainGeo.attributes.position;
const heightAt = (x, y) =>
  DATA.water[x][y] ? -0.06 : (DATA.elevation[x][y] / 1000) * HEIGHT;
for (let i = 0; i < pos.count; i++) {
  const x = i % G, y = Math.floor(i / G);
  pos.setXYZ(i, x - G / 2, heightAt(x, y), y - G / 2);
}
terrainGeo.computeVertexNormals();
terrainGeo.setAttribute("color",
  new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
const terrain = new THREE.Mesh(terrainGeo,
  new THREE.MeshLambertMaterial({vertexColors: true}));
scene.add(terrain);

// Water sheet + rivers.
const water = new THREE.Mesh(new THREE.PlaneGeometry(G, G),
  new THREE.MeshLambertMaterial({color: 0x39506b, transparent: true, opacity: 0.92}));
water.rotateX(-Math.PI / 2); water.position.y = -0.03;
scene.add(water);
{
  const pts = [];
  for (const [x1, y1, x2, y2] of DATA.rivers)
    pts.push(new THREE.Vector3(x1 - G / 2, heightAt(x1, y1) + 0.05, y1 - G / 2),
             new THREE.Vector3(x2 - G / 2, heightAt(x2, y2) + 0.05, y2 - G / 2));
  scene.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: 0x5b7893})));
}

// ---- borders are not facts (§3.1) -------------------------------------------
// Membership renders as a gradient tint over the ground. Blur radius per cell
// comes from the closed/open axis of the local owner: open peoples bleed,
// closed ones crisp. [SCAFFOLD] v1 is a fixed-kernel blend weighted by the
// owner's closed value; dead hospitality routes (scars) don't yet sharpen edges.
const tintTmp = new THREE.Color();
function paintGround(tick) {
  const own = ownerAt(tick), sum = summaryAt(tick);
  const col = terrainGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    const x = i % G, y = Math.floor(i / G);
    const [r, g, b] = BIOME_TINT[DATA.biome[x][y]];
    tintTmp.setRGB(r / 255, g / 255, b / 255);
    if (DATA.water[x][y]) { tintTmp.multiplyScalar(0.55); }
    else {
      // Neighborhood vote: how much of the 3x3 patch shares my owner. A cell
      // deep inside territory tints fully; a frontier cell tints faintly —
      // and *how* faintly scales with the owner's openness.
      const me = own[x][y];
      if (me >= 0) {
        let same = 0, n = 0;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= G || ny >= G || DATA.water[nx][ny]) continue;
          n++; if (own[nx][ny] === me) same++;
        }
        if (archaeo && attestation(me, sum.tick) === 0) { col.setXYZ(i, tintTmp.r, tintTmp.g, tintTmp.b); continue; }
        const closed = ((sum.c[me] || {}).mean || [])[3] || 0;   // closed/open axis
        const edge = n ? same / n : 1;
        const sharp = 0.35 + 0.45 * Math.max(0, closed);  // closed ⇒ crisp frontier
        const w = 0.30 * Math.min(1, edge < 1 ? (edge - 0.3) / 0.7 * (1 - sharp) + sharp * (edge > 0.6 ? 1 : 0) : 1);
        tintTmp.lerp(colorOf(me, 0.45), Math.max(0, w));
      }
    }
    col.setXYZ(i, tintTmp.r, tintTmp.g, tintTmp.b);
  }
  col.needsUpdate = true;
}

// ---- sites: the elaboration rule in action (§0, §3.4) -----------------------
// The sim has no settlement coordinates. We invent them: deterministic from
// seed + culture id, evidence-free. Winter ground = best cell (wet-adjacent,
// central); summer camps = seeded scatter inside the territory.
const siteCache = {};
function sitesOf(cid, tick) {
  const key = cid + "@" + appliedTo;
  if (siteCache[key]) return siteCache[key];
  const own = ownerAt(tick), cells = [];
  let cx = 0, cy = 0;
  for (let x = 0; x < G; x++) for (let y = 0; y < G; y++)
    if (own[x][y] === cid && !DATA.water[x][y]) { cells.push([x, y]); cx += x; cy += y; }
  if (!cells.length) return null;
  cx /= cells.length; cy /= cells.length;
  const wet = (x, y) => {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < G && ny < G && DATA.water[nx][ny]) return true;
    }
    return false;
  };
  let anchor = cells[0], best = -1e9;
  for (const [x, y] of cells) {
    const s = (wet(x, y) ? 2.2 : 0) - 0.06 * Math.hypot(x - cx, y - cy) - (x * G + y) * 1e-6;
    if (s > best) { best = s; anchor = [x, y]; }
  }
  const r = mulberry32((DATA.seed * 2654435761 ^ cid * 97) | 0);
  const camps = [];
  const pool = cells.slice();
  while (camps.length < 5 && pool.length)
    camps.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  return (siteCache[key] = {anchor, camps});
}

// ---- settlements: visual vocabulary must be earned (§3.2, §3.3) -------------
// One Group per living culture, rebuilt when summary/season/territory change.
// Aggregated seasons assemble concentric around the lodge; dispersed seasons
// scatter to the camps — a ratchet is visible as the disassembly that never
// comes (§3.4). All eight §3.3 axis→parameter rows are wired, gated by
// salience where present (contested axes are performed loudly). Statal
// architecture appears only when earned (§3.2): watchtowers from the violence
// track, the monumental lodge from charisma, guarded granaries from hoard
// pooling, keep + regalia + processional axis from fusion — a ratcheted
// lineage watches itself start looking like ANNALS, late and contingently.
const GEO = {
  tent: new THREE.ConeGeometry(0.16, 0.3, 5),
  hut: new THREE.BoxGeometry(0.22, 0.2, 0.22),
  stone: new THREE.BoxGeometry(0.26, 0.12, 0.26),
  lodge: new THREE.BoxGeometry(0.55, 0.42, 0.55),
  keep: new THREE.BoxGeometry(0.5, 0.9, 0.5),
  banner: new THREE.PlaneGeometry(0.16, 0.26),
  post: new THREE.CylinderGeometry(0.02, 0.02, 0.34, 4),
  tower: new THREE.CylinderGeometry(0.05, 0.08, 0.55, 5),
  granary: new THREE.CylinderGeometry(0.1, 0.12, 0.24, 6),
  hearth: new THREE.CylinderGeometry(0.16, 0.16, 0.03, 8),
  shrine: new THREE.ConeGeometry(0.08, 0.4, 4),
  trophy: new THREE.CylinderGeometry(0.015, 0.015, 0.42, 3),
  plaza: new THREE.CylinderGeometry(0.5, 0.5, 0.015, 12),
  axis: new THREE.BoxGeometry(0.14, 0.012, 1.6),
  crown: new THREE.TorusGeometry(0.09, 0.025, 6, 10),
  person: new THREE.CapsuleGeometry(0.018, 0.05, 2, 4),
  mound: new THREE.SphereGeometry(0.17, 6, 4, 0, 6.3, 0, 1.2),
  boat: new THREE.ConeGeometry(0.09, 0.34, 4),
  jetty: new THREE.BoxGeometry(0.13, 0.045, 0.62),
};
const MAT = {
  wood: new THREE.MeshLambertMaterial({color: 0x4a3b28}),
  straw: new THREE.MeshLambertMaterial({color: 0xb59d5e}),
  stoneM: new THREE.MeshLambertMaterial({color: 0x8e8a80}),
  white: new THREE.MeshLambertMaterial({color: 0xd8d2c0}),
  gold: new THREE.MeshLambertMaterial({color: 0xc9a227, emissive: 0x584406}),
  ember: new THREE.MeshLambertMaterial({color: 0x8c4a1d, emissive: 0x7a3208}),
  pale: new THREE.MeshLambertMaterial({color: 0xcabf9f}),
  // Unattested: no identity colour — we do not know whose this was.
  unknown: new THREE.MeshLambertMaterial({color: 0x6b6459}),
};
const groups = new Map();   // cid -> {group, key}
const groundY = (x, y) => heightAt(Math.round(x), Math.round(y));
const toWorld = (x, y, out) => out.set(x - G / 2, Math.max(0, groundY(x, y)), y - G / 2);
// salience gate: an axis renders when held strongly OR performed loudly.
const perf = (mean, sal, i, thr) =>
  (mean[i] || 0) > thr * (sal && sal[i] !== undefined && sal[i] > 0.35 ? 0.6 : 1);

function layoutOf(cid, tick, sum, season) {
  const c = sum.c[cid];
  if (!c || !c.cfg || !DATA.configs[c.cfg]) return null;
  const cfg = DATA.configs[c.cfg];
  const st = DATA.structures[cfg.seasons[season]] || {};
  const sites = sitesOf(cid, tick);
  if (!sites) return null;
  const r = mulberry32((DATA.seed ^ cid * 7919) | 0);
  const mean = c.mean || [], sal = c.sal, dom = c.dom || [0, 0, 0];
  const n = Math.max(3, Math.min(14, Math.round((c.pop || 60) / 22)));
  const spots = [];
  const [ax, ay] = sites.anchor;
  // nomadism (§3.3 row 3): hide tents ↔ timber ↔ stone footings.
  const dwelling = (mean[2] || 0) > 0.25 ? "tent"
                 : (mean[2] || 0) < -0.35 ? "stone" : "hut";
  if (st.settlement === "aggregated") {
    const charisma = dom[2] > 0.5, fused = !!c.fused;
    // The lodge: monumental only when the charisma track earned it (§3.2).
    if (st.authority && st.authority !== "none")
      spots.push({id: "lodge", x: ax, y: ay, kind: fused ? "keep" : "lodge",
                  s: charisma ? 1.55 : 1});
    if (charisma && !fused) spots.push({id: "plaza", x: ax, y: ay - 0.02, kind: "plaza", s: 1});
    if (fused) {  // regalia + processional axis: the fusion vocabulary
      spots.push({id: "crown", x: ax, y: ay, kind: "crownUp", s: 1});
      spots.push({id: "axis", x: ax, y: ay + 1.1, kind: "axis", s: 1});
    }
    // command (row 6): axial planned layout ↔ organic scatter.
    const axial = perf(mean, sal, 5, 0.2);
    for (let i = 0; i < n; i++) {
      let hx, hy;
      if (axial) {
        const row = Math.floor(i / 4), col = i % 4;
        hx = ax + (col - 1.5) * 0.5; hy = ay + 0.7 + row * 0.45;
      } else {
        const th = r() * Math.PI * 2, rad = 0.55 + r() * 1.15;
        hx = ax + Math.cos(th) * rad; hy = ay + Math.sin(th) * rad;
      }
      // rank (row 1): a Gini coefficient of rooflines.
      const rank = Math.max(0, mean[0] || 0);
      spots.push({id: "d" + i, x: hx, y: hy, kind: dwelling,
                  s: 0.7 + rank * (r() - 0.35) * 1.3});
    }
    // closed hardens / violence accumulates ⇒ palisade + watchtower (§3.2).
    if (perf(mean, sal, 3, 0.3) || dom[0] > 0.5) {
      const posts = 14;
      for (let i = 0; i < posts; i++) {
        const th = i / posts * Math.PI * 2;
        spots.push({id: "p" + i, x: ax + Math.cos(th) * 1.9,
                    y: ay + Math.sin(th) * 1.9, kind: "post", s: 1});
      }
      if (dom[0] > 0.5) spots.push({id: "tower", x: ax + 1.9, y: ay, kind: "tower", s: 1});
    }
    // accumulation (row 5): guarded granaries ↔ feast hearths, open middens.
    if (perf(mean, sal, 4, 0.25) || st.pooling === "hoard") {
      for (let i = 0; i < 3; i++)

    } else if ((mean[4] || 0) < -0.25)
      spots.push({id: "hearth", x: ax - 0.6, y: ay + 0.4, kind: "hearth", s: 1});
    // sacred (row 7) and violence iconography (row 8).
    if (perf(mean, sal, 6, 0.25)) spots.push({id: "shrine", x: ax - 0.8, y: ay - 0.7, kind: "shrine", s: 1});
    if (perf(mean, sal, 7, 0.25))

    }

                  kind: "hearth", s: 1});

  // split is the honest one: built form leaves traces a spade would find
  // (post holes, hearths, footings, granary pits), while heraldry, regalia

  // unattested people is a scatter of mounds — someone lived here; who they
  // were and how they ranked each other is not ours to draw.
  const conf = confidence(cid, sum.tick);

// ---- the water: bodies, shores, and who can reach whom by boat --------------
// The sim treats water as contact infrastructure, not scenery: peoples working

{

    const id = next++, stack = [[x, y]];
    bodyId[x][y] = id;
    while (stack.length) {
      const [cx, cy] = stack.pop();
      for (const [nx, ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]]) {
        if (nx < 0 || ny < 0 || nx >= G || ny >= G) continue;

// ---- named geography: the map says what the people call it ------------------

// the only invention and it invents nothing — it repeats what the bundle says.

scene.add(labelGroup);

// ---- archaeologist mode: what the surviving record supports -----------------
// The almanac's contract run in reverse (VIEWER.md §0). Normal mode renders
// the world as it WAS — the sim's ground truth, decorated by the elaboration
// rule. Archaeologist mode renders only what a reader at the end of the
// history could actually justify: a people is known through its surviving
// chronicle entries, and social form (regalia, banners, plans, authority) is
// an inference that unattested peoples cannot support. Material traces —
// terrain, water, and the scars — survive without text, which is precisely
// the point: the ratchet mark outlasts the argument about it.
//
// The asymmetry this exposes is the argument: written entries survive far
// better than oral ones, so literate settled peoples dominate the record
// while great talkers can vanish. A people may have lived loudly and left
// us almost nothing.
let archaeo = false;
const evidence = new Map();   // cid -> [{tick, n}] cumulative surviving count
{
  const running = new Map();
  for (const m of DATA.margins) {
    if (!m.surviving || m.cid == null) continue;
    const cid = String(m.cid);
    const n = (running.get(cid) || 0) + 1;
    running.set(cid, n);
    if (!evidence.has(cid)) evidence.set(cid, []);
    evidence.get(cid).push({tick: m.tick, n});
  }
}
const wroteTotal = new Map();
for (const m of DATA.margins) {
  const cid = String(m.cid);
  if (cid !== "null") wroteTotal.set(cid, (wroteTotal.get(cid) || 0) + 1);
}
function attestation(cid, tick) {
  const rows = evidence.get(String(cid));
  if (!rows) return 0;
  let lo = -1, hi = rows.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1;
    if (rows[m].tick <= tick) lo = m; else hi = m - 1; }
  return lo < 0 ? 0 : rows[lo].n;
}
// How much of a settlement's form the record can carry: none, material
// traces only, or the full social reading.
function confidence(cid, tick) {
  if (!archaeo) return 2;

// ---- heraldry, schismogenetically (§3.5) ------------------------------------
// Charge selection is biased against current territorial neighbours' charges:
// each culture takes the first charge in its seeded preference order not
// already flown by a lower-cid neighbour — repulsion, deterministically.
const CHARGES = ["disc", "chevron", "cross", "bar", "diamond", "crescent", "ring", "tri"];
const bannerTexCache = new Map();
function neighborsAt(tick) {
  const own = ownerAt(tick), nb = new Map();
  for (let x = 0; x < G - 1; x++) for (let y = 0; y < G - 1; y++) {
    const a = own[x][y], b = own[x + 1][y], c = own[x][y + 1];
    for (const [p, q] of [[a, b], [a, c]])
      if (p >= 0 && q >= 0 && p !== q) {
        if (!nb.has(p)) nb.set(p, new Set());

}

  for (const cid of [...nb.keys()].sort((a, b) => a - b)) {
    const r = mulberry32((DATA.seed * 31 ^ cid * 811) | 0);
    const pref = CHARGES.map((c, i) => [r(), i]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
    const taken = new Set([...(nb.get(cid) || [])].map(o => chargeOf.get(o)).filter(v => v !== undefined));

  const cv = document.createElement("canvas"); cv.width = 32; cv.height = 48;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = `hsl(${hueOf(cid)}, 55%, 40%)`; ctx.fillRect(0, 0, 32, 48);
  ctx.fillStyle = ctx.strokeStyle = "#efe4c9"; ctx.lineWidth = 5;

  else if (name === "ring") { ctx.arc(16, 24, 9, 0, 7); ctx.stroke(); }
  else if (name === "chevron") { ctx.moveTo(4, 32); ctx.lineTo(16, 16); ctx.lineTo(28, 32); ctx.stroke(); }
  else if (name === "cross") { ctx.fillRect(13, 10, 6, 28); ctx.fillRect(6, 21, 20, 6); }
  else if (name === "bar") { ctx.fillRect(6, 20, 20, 8); }
  else if (name === "diamond") { ctx.moveTo(16, 12); ctx.lineTo(26, 24); ctx.lineTo(16, 36); ctx.lineTo(6, 24); ctx.fill(); }
  else if (name === "crescent") { ctx.arc(16, 24, 9, 0.6, 5.7); ctx.stroke(); }

// The material record: an abandoned crown, a ratchet mark, a cold hearth, a
// road that stopped being walked (§3.5).
const scarMeshes = [];  // scar layer, rebuilt on seek
// Scars are the material record: a ratchet mark, a cold hearth, a road that

// everything else on screen they persist in archaeologist mode even for

  Object.entries(DATA.cultures).map(([cid, m]) => [m.name, +cid]));

  for (const m of scarMeshes) scene.remove(m);

    toWorld(x, y, mesh.position);
    mesh.position.y += lift;
    scene.add(mesh); scarMeshes.push(mesh);

  for (const e of DATA.events2)
    if (e.type === "unfusion" && e.tick <= tick && e.culture != null) {
      const s = sitesOf(e.culture, tick);
      if (!s) continue;
      const m = new THREE.Mesh(GEO.crown, MAT.gold);
      m.rotation.x = Math.PI / 2 + 0.4;
      drop(m, s.anchor[0] + 0.35, s.anchor[1] + 0.3, 0.03);
    }

    if (sc.kind === "dead_route" && parts[1] && cidByName.has(parts[1])) {
      // A road much walked, now watched from both sides: the line remains,
      // broken, between the two anchors.
      const B = sitesOf(cidByName.get(parts[1]), tick);
      if (!B) continue;
      const pts = [];
      for (let i = 0; i <= 12; i++) {
        if (i % 3 === 2) continue;   // the gaps are the point
        const u = i / 12;
        const x = A.anchor[0] + (B.anchor[0] - A.anchor[0]) * u;
        const y = A.anchor[1] + (B.anchor[1] - A.anchor[1]) * u;
        pts.push(new THREE.Vector3(x - G / 2, Math.max(0, groundY(x, y)) + 0.05, y - G / 2));
      }

        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color: 0x7a6a52}));

    if (sc.kind === "ratchet_mark")            // the standing stone
      drop(new THREE.Mesh(GEO.tower, MAT.stoneM), A.anchor[0] - 0.7, A.anchor[1] + 0.6, 0.26);
    else if (sc.kind === "abandonment")        // hearths gone cold
      drop(new THREE.Mesh(GEO.hearth, MAT.stoneM), A.anchor[0] + 0.6, A.anchor[1] - 0.6, 0.02);
    else if (sc.kind === "liberation")         // the mark of a way resumed
      drop(new THREE.Mesh(GEO.post, MAT.wood), A.anchor[0] - 0.5, A.anchor[1] - 0.5, 0.17);
  }
}

const v3 = new THREE.Vector3();

// Seasonal assembly and disassembly — the §3.4 shot. Rather than rebuilding
// each people's settlement when the season flips, every element carries a
// stable slot id, so the winter house and the summer tent of household i are

// valley, and reassembles in autumn under a different spatial logic. Elements

// Reuse also fixes the cost: positions update in place, so playing at speed

const layoutCache = new Map();
function cachedLayout(cid, tick, sum, season) {
  const key = `${cid}|${season}|${sum.tick}|${appliedTo}|${archaeo ? 1 : 0}`;
  if (layoutCache.has(key)) return layoutCache.get(key);
  if (layoutCache.size > 400) layoutCache.clear();

const ease = (u) => u * u * (3 - 2 * u);
const MAT_FOR = {tent: "id", hut: "id", stone: "stoneM", lodge: "idDark",

function ensureGroup(cid, conf) {

  if (g) scene.remove(g.group);

function placeSlot(g, cid, id, spot, x, y, scale, now) {

    const m = new THREE.Mesh(GEO[spot.kind], MAT.pale);
    g.group.add(m);

    g.slots.set(id, slot);
  }
  const m = slot.mesh;
  if (scale < 0.02) { m.visible = false; return; }
  m.visible = true;
  if (slot.kind !== spot.kind) {          // only on a genuine form change
    m.geometry = GEO[spot.kind];

    if (spot.kind === "crownUp") m.rotation.x = Math.PI / 2;
    m.userData.kind = spot.kind;
    slot.kind = spot.kind;

  // Regalia announce themselves: the crown swells and settles after fusion.
  if (id === "crown" && crownPulse && crownPulse.cid === +cid) {
    const age = (now - crownPulse.t0) / 1000;
    if (age > 6) crownPulse = null;

function updateSettlements(t) {
  const tick = Math.floor(t);
  assignCharges(tick);
  const sum = summaryAt(tick), alive = new Set();
  const now = performance.now();
  // The year holds its form, then moves: stable for most of the season, the
  // walk in its last third. Struck camps do not teleport.
  const frac = t - tick;
  const u = frac < 0.62 ? 0 : ease((frac - 0.62) / 0.38);
  for (const cid of Object.keys(sum.c)) {
    alive.add(cid);
    const A = cachedLayout(+cid, tick, sum, tick % 4);
    if (!A) continue;
    const B = u > 0 ? (cachedLayout(+cid, tick, sum, (tick + 1) % 4) || A) : A;

    g.anchor = sitesOf(+cid, tick)?.anchor;

    const mapB = new Map(B.spots.map(s2 => [s2.id, s2]));

    for (const id of new Set([...mapA.keys(), ...mapB.keys()])) {
      const a = mapA.get(id), b = mapB.get(id);
      const src = a || b, dst = b || a;

    for (const [id, slot] of g.slots)

  for (const [cid, g] of groups)
    if (!alive.has(cid)) { scene.remove(g.group); groups.delete(cid); }
  updateCrownScars(tick);
}

// ---- LOD bubble band (§2): people are statistics until the camera is close --

const peopleGroups = new Map();

  for (const [cid, g] of groups) {
    if (!g.anchor) continue;
    toWorld(g.anchor[0], g.anchor[1], v3);
    const near = camera.position.distanceTo(v3) < G * 0.33;
    const have = peopleGroups.has(cid);
    if (near && !have) {
      const pg = new THREE.Group();
      const r = mulberry32((DATA.seed * 13 ^ +cid * 389) | 0);
      const mat = new THREE.MeshLambertMaterial({color: colorOf(+cid, 0.62)});
      for (let i = 0; i < 7; i++) {
        const m = new THREE.Mesh(GEO.person, mat);
        toWorld(g.anchor[0] + (r() - 0.5) * 1.6, g.anchor[1] + (r() - 0.5) * 1.6, m.position);

    } else if (!near && have) {

    if (!groups.has(cid)) { scene.remove(pg); peopleGroups.delete(cid); }

  const own = ownerAt(tick), sh = shoresAt(tick);
  for (const cid of Object.keys(sh)) {
    const site = sitesOf(+cid, tick);
    if (!site) continue;
    const [ax, ay] = site.anchor;
    // nearest water cell to the anchor, then a jetty reaching into it
    let bx = null, by = null, best = 9e9;
    for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) {
      if (!DATA.water[x][y]) continue;
      const d = (x - ax) ** 2 + (y - ay) ** 2;
      if (d < best) { best = d; bx = x; by = y; }
    }
    if (bx === null || best > 9) continue;   // not truly waterside
    const m = new THREE.Mesh(GEO.jetty, MAT.wood);
    const mx = ax + (bx - ax) * 0.55, my = ay + (by - ay) * 0.55;
    toWorld(mx, my, m.position);
    m.position.y = 0.02;
    m.rotation.y = Math.atan2(by - ay, bx - ax);
    jettyGroup.add(m);
  }
}
const firePool = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.04, 6), MAT.wood));
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 5), MAT.fire);
  flame.position.y = 0.12; g.add(flame);
  const light = new THREE.PointLight(0xff9040, 1.6, 3.5);
  light.position.y = 0.3; g.add(light);
  g.visible = false; scene.add(g); firePool.push(g);
}
const va = new THREE.Vector3(), vb = new THREE.Vector3();
let beatFire = null;   // [a, b] culture pair while an encounter card is up
function updateMotion(t, now) {
  const tick = Math.floor(t);
  updateLandings(tick);
  let wi = 0, fi = 0, bi = 0;
  for (const f of DATA.flows) {
    if (f.tick > tick) break;
    if (f.tick + WALK <= t || wi >= walkerPool.length) continue;
    const A = anchorOf(f.from, tick), B = anchorOf(f.to, tick);
    if (!A || !B) continue;
    const u = (t - f.tick) / WALK;
    if (waterLinked(f.from, f.to, tick)) {
      if (bi < boatPool.length) {           // they go by water
        const m = boatPool[bi++];
        const uu = Math.max(0, Math.min(1, u));
        const x = A[0] + (B[0] - A[0]) * uu, y = A[1] + (B[1] - A[1]) * uu;
        m.position.set(x - G / 2, 0.03 + Math.sin(t * 3 + f.from) * 0.012, y - G / 2);
        m.rotation.z = -Math.atan2(B[1] - A[1], B[0] - A[0]);
        m.material.color.copy(colorOf(f.from, 0.6));
        m.visible = true;
      }
      continue;
    }
    for (let j = 0; j < Math.min(f.n, 3) && wi < walkerPool.length; j++) {
      const m = walkerPool[wi++];
      const uu = Math.max(0, Math.min(1, u - j * 0.05));
      const x = A[0] + (B[0] - A[0]) * uu, y = A[1] + (B[1] - A[1]) * uu;
      toWorld(x + Math.sin(uu * 9 + j) * 0.15, y + Math.cos(uu * 7 + j) * 0.15, m.position);
      m.position.y += 0.05;
      m.material.color.copy(colorOf(f.from, 0.6));
      m.visible = true;
    }
  }
  const lit = [];
  for (const f of DATA.feasts) {
    if (f.tick > tick) break;
    if (f.tick + FEAST_GLOW > t) lit.push([f.a, f.b]);
  }
  if (beatFire) lit.push(beatFire);
  for (const [a, b] of lit.slice(-firePool.length)) {
    const A = anchorOf(a, tick), B = anchorOf(b, tick);
    if (!A || !B) continue;
    const g = firePool[fi++];
    toWorld((A[0] + B[0]) / 2, (A[1] + B[1]) / 2, g.position);
    g.position.y += 0.03;
    g.children[1].scale.setScalar(0.85 + 0.3 * Math.abs(Math.sin(now * 0.011)));
    g.visible = true;
  }
  for (; wi < walkerPool.length; wi++) walkerPool[wi].visible = false;
  for (; bi < boatPool.length; bi++) boatPool[bi].visible = false;
  for (; fi < firePool.length; fi++) firePool[fi].visible = false;
}

// ---- the margins: chronicle attrition as ambience (§4) ----------------------
// Entries appear as written; ones the record will lose render already
// crumbling at the edge, and redacted ones carry the strike. Honest gaps.
const marginsEl = document.getElementById("margins");
const margins = DATA.margins.slice().sort((a, b) => a.tick - b.tick);
let marginsKey = -1;
function updateMargins(tick) {
  if (tick === marginsKey) return;
  marginsKey = tick;
  let hi = margins.findIndex(m => m.tick > tick);
  if (hi < 0) hi = margins.length;
  const recent = margins.slice(Math.max(0, hi - 3), hi)
                        .filter(m => tick - m.tick < 40);
  marginsEl.innerHTML = "";
  for (const m of recent) {
    const d = document.createElement("div");
    d.className = "marg" + (m.surviving ? "" : " doomed") + (m.redacted ? " redacted" : "");
    d.style.opacity = Math.max(0.25, 1 - (tick - m.tick) / 44).toFixed(2);
    const who = document.createElement("div"); who.className = "who";
    who.textContent = `${m.author}, ${m.medium} · year ${Math.floor(m.tick / 4)}`;
    const tx = document.createElement("div"); tx.className = "txt";
    tx.textContent = m.text.length > 150 ? m.text.slice(0, 148) + "…" : m.text;
    d.append(who, tx);
    marginsEl.appendChild(d);
  }
}

// ---- camera: spring-damper rig with curved altitude path (§2) ---------------
const cam = {
  focus: new THREE.Vector3(0, 0, 0), fTarget: new THREE.Vector3(0, 0, 0),
  yaw: 0.8, pitch: 0.9, dist: G * 1.15, dTarget: G * 1.15, vel: new THREE.Vector3(),
  pTarget: null,   // director-set pitch; released to the viewer on drag
};
function camStep(dt) {
  // Critically-damped-ish spring toward the focus target; the altitude bump
  // during long flights gives the curved path of the ANNALS rig.
  const k = 3.2, d = 2 * Math.sqrt(k);
  v3.copy(cam.fTarget).sub(cam.focus).multiplyScalar(k)
    .addScaledVector(cam.vel, -d);
  cam.vel.addScaledVector(v3, dt);
  cam.focus.addScaledVector(cam.vel, dt);
  cam.dist += (cam.dTarget - cam.dist) * Math.min(1, dt * 3);
  if (cam.pTarget !== null)
    cam.pitch += (cam.pTarget - cam.pitch) * Math.min(1, dt * 2.5);
  const flight = Math.min(1, cam.fTarget.distanceTo(cam.focus) / (G * 0.4));
  const alt = cam.dist * (1 + 0.8 * Math.sin(Math.PI * flight));
  camera.position.set(
    cam.focus.x + Math.cos(cam.yaw) * Math.cos(cam.pitch) * alt,
    cam.focus.y + Math.sin(cam.pitch) * alt,
    cam.focus.z + Math.sin(cam.yaw) * Math.cos(cam.pitch) * alt);
  camera.lookAt(cam.focus);
}
// Shot grammar (§4): each beat kind gets its own framing. The ratchet is an
// overhead — the assembly that fails to disperse reads in plan view; the
// liberation is low and close; the schism is wide enough to hold both camps.
// Long moves cut instead of flying (the ANNALS rig's rule against airline
// tours); pitch is directed only until the viewer next drags.
const SHOTS = {fusion: {d: 0.20, p: 0.62}, ratchet: {d: 0.30, p: 1.28},
               unfusion: {d: 0.22, p: 0.7}, liberation: {d: 0.17, p: 0.5},
               schism: {d: 0.55, p: 0.95}, extinction: {d: 0.45, p: 1.1},
               encounter: {d: 0.22, p: 0.68}, succession: {d: 0.24, p: 0.78}};
function frameShot(kind) {
  const s = SHOTS[kind] || {d: 0.28, p: 0.9};
  cam.dTarget = G * s.d;
  cam.pTarget = s.p;
  if (cam.fTarget.distanceTo(cam.focus) > G * 0.9) {   // cut, don't tour
    cam.focus.copy(cam.fTarget).add(v3.set(G * 0.06, 0, G * 0.06));
    cam.vel.set(0, 0, 0);
  }
}
function flyTo(cid, tick, kind) {
  const s = sitesOf(cid, tick);
  if (!s) return;
  toWorld(s.anchor[0], s.anchor[1], cam.fTarget);
  frameShot(kind);
}

let dragging = false, px = 0, py = 0;
stage.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; }, sig);
addEventListener("pointerup", () => dragging = false, sig);
addEventListener("pointermove", e => {
  if (!dragging) return;
  cam.pTarget = null;   // the viewer took the wheel
  cam.yaw += (e.clientX - px) * 0.005;
  cam.pitch = Math.min(1.35, Math.max(0.25, cam.pitch + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY;
}, sig);
stage.addEventListener("wheel", e => {
  cam.dTarget = Math.min(G * 2.2, Math.max(G * 0.12, cam.dTarget * (1 + e.deltaY * 0.001)));
}, {passive: true, signal: ctl.signal});

// ---- the director: this camera flies to arguments (§4) ----------------------
// Beats from events + verbatim deliberations; priority bus with a cooldown.
// [SCAFFOLD] one shot type (fly + card). Handoff non-events, defection walks,
// regalia at fusion, and chronicle-attrition ambience are TODO.
const PRIORITY = {fusion: 9, ratchet: 8, unfusion: 7, liberation: 7, schism: 6,
                  hardening: 5, ratchet_crisis: 5, recovery: 4, contradiction: 3,
                  encounter: 2, extinction: 6, succession: 2};
// The gloss a beat falls back to when no chronicle entry survives for it.
const GLOSSES = {
  succession: "The handoff: power dissolving on schedule — the recurring " +
              "non-event. The chief steps down as the ice breaks.",
  ratchet: "The assembly that fails to disperse: the spring disassembly " +
           "never comes.",
  unfusion: "The regalia are abandoned where they fell.",
  fusion: "Regalia appear; the frontier begins to read like a line.",
};
const beats = [];
for (const e of DATA.events2 || DATA.events) {
  let quote = e.note || null;
  if (e.type === "ratchet" && e.structure)
    quote = `The ${e.structure.replace(/_/g, " ")} no longer dissolves; ` +
            `the ${(e.displaced || "seasonal way").replace(/_/g, " ")} is displaced.`;
  beats.push({tick: e.tick, kind: e.type, culture: e.culture, quote,
              mechanism: e.mechanism});
}
for (const d of DATA.deliberations)
  beats.push({tick: d.tick, kind: d.kind, culture: d.culture, quote: d.text,
              speaker: d.speaker, stance: d.stance, model: d.model,
              other: d.other});
beats.sort((a, b) => a.tick - b.tick || (PRIORITY[b.kind] || 0) - (PRIORITY[a.kind] || 0));
const chronMap = new Map();
for (const c of DATA.chronicle) {
  const k = `${c.tick}|${c.type}`;
  if (!chronMap.has(k)) chronMap.set(k, c);
}
const survivingChron = new Map();
for (const m of DATA.margins) {
  if (!m.surviving) continue;
  const k = `${m.tick}|${m.type}`;
  if (!survivingChron.has(k)) survivingChron.set(k, m);
}

const beatEl = document.getElementById("beat");
let beatPtr = 0, beatCool = 0, beatShownAt = 0;
function seekBeats(tick) {
  beatPtr = beats.findIndex(b => b.tick > tick);
  if (beatPtr < 0) beatPtr = beats.length;
  beatEl.classList.remove("on");
  beatFire = null;
}
let crownPulse = null;   // {cid, t0} — regalia announcing themselves at fusion
function directorStep(tick, now) {
  while (beatPtr < beats.length && beats[beatPtr].tick <= tick) {
    const b = beats[beatPtr++];
    const pri = PRIORITY[b.kind] || 0;
    // Cooldown by rank: rare structural beats interrupt; encounters and
    // successions only fill silence.
    if (pri < 2) continue;
    if (now < beatCool && pri < 6) continue;
    if (pri <= 2 && now < beatCool + 2500) continue;
    beatCool = now + 4500;
    beatShownAt = now;
    if (b.kind === "fusion" && b.culture != null)
      crownPulse = {cid: b.culture, t0: now};
    // The encounter shot: two delegations across a frontier fire — the
    // camera lands on the border midpoint, not either people's ground.
    if (b.kind === "encounter" && b.other != null && b.culture != null) {
      const A = anchorOf(b.culture, tick), B = anchorOf(b.other, tick);
      if (A && B) {
        toWorld((A[0] + B[0]) / 2, (A[1] + B[1]) / 2, cam.fTarget);
        frameShot("encounter");
        beatFire = [b.culture, b.other];
      }
    } else if (b.culture != null) flyTo(b.culture, tick, b.kind);
    const chron = chronMap.get(`${b.tick}|${b.kind}`);
    // Archaeologist mode: a deliberation is not evidence — what was said
    // reaches us only if some surviving chronicle recorded it. The film may
    // quote only the record, and must show the gap where there is none.
    const surv = survivingChron.get(`${b.tick}|${b.kind}`);
    const quote = archaeo
      ? (surv ? surv.text : "The record does not preserve what was said here.")
      : ((chron && chron.text) || b.quote || GLOSSES[b.kind]
         || "(the record is silent)");
    const who = archaeo
      ? (surv ? `${surv.author}, ${surv.medium} — survives` : "no surviving account")
      : (b.speaker
         ? `${b.speaker.name} of the ${b.speaker.culture} — ${(b.speaker.traits || []).join(", ")}`
         : chron ? `${chron.author}, ${chron.medium}` : "");
    document.getElementById("beat-kind").textContent =
      `${b.kind.replace("_", " ")} · year ${Math.floor(b.tick / 4)}` +
      (b.stance ? ` · settled toward ${b.stance}` : "") +
      (b.mechanism ? ` · by ${b.mechanism}` : "");
    document.getElementById("beat-quote").textContent = quote;
    document.getElementById("beat-cite").textContent =
      who + (b.model && !b.model.startsWith("stub") ? ` · argued live (${b.model})` : "");
    beatEl.classList.add("on");
  }
  if (beatEl.classList.contains("on") && now - beatShownAt > 9000) {
    beatEl.classList.remove("on");
    beatFire = null;
  }
  // Idle: with nothing to film for a while, pull back to the establishing
  // wide and drift — the land itself is the between-beats shot.
  if (playing && now - beatShownAt > 16000 && !dragging) {
    cam.dTarget = Math.max(cam.dTarget, G * 0.85);
    cam.pTarget = 0.95;
    cam.yaw += 0.0006;
  }
}

// ---- the dossier: inspection, never intervention (§5) -----------------------
// Clicking a people opens what the sim would say about them — including the
// prose sketch, which is the exact text the oracle sees when it argues as
// them. Salience marks the axes they currently perform; in archaeologist
// mode the panel reports what survives instead of what was, because a
// dossier assembled from a lost record would be a fabrication.
const dossierEl = document.getElementById("dossier");
let dossierCid = null;
function showDossier(cid, tick) {
  dossierCid = cid;
  document.getElementById("legend").style.display = "none";
  const sum = summaryAt(tick), c = sum.c[String(cid)];
  const meta = DATA.cultures[String(cid)] || {};
  dossierEl.classList.add("on");
  dossierEl.replaceChildren();
  const h = document.createElement("h2");
  const sw = document.createElement("span");
  sw.className = "sw";
  sw.style.background = `hsl(${hueOf(cid)}, 50%, 45%)`;
  const x = document.createElement("span");
  x.className = "close"; x.textContent = "×";
  x.addEventListener("click", () => {
    dossierEl.classList.remove("on"); dossierCid = null;
    document.getElementById("legend").style.display = "";
  });
  h.append(sw, document.createTextNode(meta.name || `people ${cid}`), x);
  dossierEl.appendChild(h);

  const line = document.createElement("div");
  line.className = "line";
  if (!c) {
    line.textContent = "No longer among the living at this year.";
    dossierEl.appendChild(line);
    return;
  }
  const cfg = DATA.configs[c.cfg] || {};
  line.textContent = `${c.pop} souls · ${c.fused ? "fused" : c.switching ? "keeps the seasonal round" : "one way the year round"}`;
  dossierEl.appendChild(line);

  if (cfg.gloss) {
    const g = document.createElement("div");
    g.className = "sketch";
    g.textContent = `Their year is shaped so: ${cfg.gloss}.`;
    dossierEl.appendChild(g);
  }

  // The eight axes, with salience shown as the width of what they perform.
  const secA = document.createElement("div");
  secA.className = "sec"; secA.textContent = "the eight axes";
  dossierEl.appendChild(secA);
  const axes = document.createElement("div");
  axes.className = "axes";
  (DATA.axes || []).forEach(([pos, neg], i) => {
    const row = document.createElement("div");
    row.className = "ax";
    const l = document.createElement("span"); l.textContent = neg;
    const bar = document.createElement("div"); bar.className = "bar";
    const mark = document.createElement("i");
    const v = Math.max(-1, Math.min(1, (c.mean || [])[i] || 0));
    mark.style.left = `calc(${(v + 1) / 2 * 100}% - 1.5px)`;
    bar.appendChild(mark);
    const sal = (c.sal || [])[i];
    if (sal !== undefined && sal !== null) {   // performed loudly = wider band
      const band = document.createElement("u");
      const w = Math.max(4, Math.min(100, sal * 100));
      band.style.width = w + "%";
      band.style.left = `calc(${(v + 1) / 2 * 100}% - ${w / 2}%)`;
      bar.appendChild(band);
    }
    const r = document.createElement("span"); r.className = "r"; r.textContent = pos;
    row.append(l, bar, r);
    axes.appendChild(row);
  });
  dossierEl.appendChild(axes);

  // The sketch: the numeric→linguistic boundary, exactly as the oracle saw it.
  const era = String(Math.floor(tick / (DATA.era_ticks || 80)));
  const sk = (DATA.sketches || {})[era] || {};
  if (sk[String(cid)]) {
    const secS = document.createElement("div");
    secS.className = "sec"; secS.textContent = "as an ethnographer would describe them";
    const p = document.createElement("div");
    p.className = "sketch"; p.textContent = sk[String(cid)];
    dossierEl.append(secS, p);
  }

  // Domination tracks: violence, information, charisma.
  const secD = document.createElement("div");
  secD.className = "sec"; secD.textContent = "domination tracks";
  const d = document.createElement("div");
  d.className = "line";
  const names = ["violence", "information", "charisma"];
  d.textContent = (c.dom || []).map((v, i) =>
    `${names[i]} ${v < 0.05 ? "—" : v.toFixed(2)}`).join(" · ");
  dossierEl.append(secD, d);

  // What survives of them, and what they lost.
  const wrote = wroteTotal.get(String(cid)) || 0;
  const att = attestation(cid, tick);
  const secR = document.createElement("div");
  secR.className = "sec"; secR.textContent = "the record";
  const rec = document.createElement("div");
  rec.className = "line";
  rec.textContent = wrote === 0
    ? "They have written nothing that reaches this year."
    : `${att} of ${wrote} entries survive to the end of the record` +
      (att === 0 ? " — nothing of theirs reaches us." : ".");
  dossierEl.append(secR, rec);
}

// ---- legend -----------------------------------------------------------------
// Struck-through means extinct; the not-yet-born are simply absent — the
// legend must not imply a fate the record hasn't written yet.
const firstSeen = {};
for (const s of sums)
  for (const cid of Object.keys(s.c))
    if (!(cid in firstSeen)) firstSeen[cid] = s.tick;
const legendEl = document.getElementById("legend");
function drawLegend(tick) {
  const sum = summaryAt(tick);
  legendEl.innerHTML = "";
  for (const [cid, meta] of Object.entries(DATA.cultures)) {
    const live = cid in sum.c;
    if (!live && (firstSeen[cid] === undefined || firstSeen[cid] > tick)) continue;
    const row = document.createElement("div");
    row.className = "p" + (live ? "" : " gone");
    const sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = `hsl(${hueOf(+cid)}, 50%, 45%)`;
    row.append(sw, document.createTextNode(meta.name));
    if (archaeo) {
      const n = attestation(cid, tick), wrote = wroteTotal.get(cid) || 0;
      const tag = document.createElement("span");
      tag.className = "att";
      tag.textContent = n === 0 ? (wrote ? `unattested (${wrote} lost)` : "unattested")
                                : `${n} of ${wrote}`;
      if (n === 0) row.classList.add("unattested");
      row.appendChild(tag);
      sw.style.background = n === 0 ? "#6b6459" : `hsl(${hueOf(+cid)}, 50%, 45%)`;
    }
    if (live) row.addEventListener("click", () => {
      flyTo(+cid, curTick);
      showDossier(+cid, Math.floor(curTick));
    });
    legendEl.appendChild(row);
  }
}

// ---- time: play, scrub, seasons ---------------------------------------------
const scrubEl = document.getElementById("scrub"), playBtn = document.getElementById("play");
scrubEl.max = T - 1;
let curTick = 0, playing = false, tps = 6, lastPaint = -1, lastLegend = -1;
function setTick(t, hard) {
  curTick = Math.max(0, Math.min(T - 1, t));
  scrubEl.value = Math.floor(curTick);
  const tick = Math.floor(curTick);
  document.getElementById("year").textContent = "year " + Math.floor(tick / 4);
  document.getElementById("season").textContent = SEASONS[tick % 4];
  if (hard) { seekBeats(tick); beatCool = 0; }
  if (tick !== lastPaint) { paintGround(tick); lastPaint = tick; }
  if (Math.floor(tick / 20) !== lastLegend) {
    drawLegend(tick); lastLegend = Math.floor(tick / 20);
    if (dossierCid !== null) showDossier(dossierCid, tick);
  }
}
playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "pause" : "play"; }, sig);

// ---- archaeologist mode toggle ----------------------------------------------
const digBtn = document.getElementById("dig"), modeNote = document.getElementById("modenote");
function setArchaeo(on) {
  archaeo = on;
  digBtn.classList.toggle("on", on);
  modeNote.classList.toggle("on", on);
  if (on) {
    const surv = DATA.margins.filter(m => m.surviving).length;
    const oral = DATA.margins.filter(m => m.medium === "oral");
    const oralSurv = oral.filter(m => m.surviving).length;
    modeNote.textContent =
      `As the surviving record supports it: ${surv} of ${DATA.margins.length} ` +
      `entries reach us (${oral.length ? Math.round(100 * oralSurv / oral.length) : 0}% of oral, ` +
      `${Math.round(100 * (surv - oralSurv) / Math.max(1, DATA.margins.length - oral.length))}% of written). ` +
      `Mounds are peoples no surviving text attests; heraldry and regalia are ` +
      `dropped as textual inference, built form is kept as material trace.`;
  }
  // Force a rebuild of everything the mode changes.
  for (const [, g] of groups) scene.remove(g.group);
  groups.clear(); layoutCache.clear();
  lastPaint = -1; lastLegend = -1; marginsKey = -1;
  setTick(curTick, true);
}
digBtn.addEventListener("click", () => setArchaeo(!archaeo), sig);
scrubEl.addEventListener("input", () => { playing = false; playBtn.textContent = "play"; setTick(+scrubEl.value, true); }, sig);
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  if (e.key === "a" || e.key === "A") setArchaeo(!archaeo);
  if (e.key === "[") tps = Math.max(1, tps / 2);
  if (e.key === "]") tps = Math.min(64, tps * 2);
  document.getElementById("speed").textContent = tps + " t/s";
}, sig);

document.getElementById("title").textContent =
  `The Annals of the ${Object.keys(DATA.cultures).length} Peoples`;
document.getElementById("subtitle").textContent =
  `seed ${DATA.seed} · ${T} seasons · a history argued into being`;

// ---- main loop --------------------------------------------------------------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  const lh = 0.036;
  for (const sp of labelGroup.children)
    sp.scale.set(lh * sp.userData.aspect / (w / h), lh, 1);
}
addEventListener("resize", resize, sig); resize();

let prev = performance.now();
// #t=1234&play seeks (and optionally starts) — a shareable moment.
const hash = new URLSearchParams(location.hash.slice(1));
setTick(+(hash.get("t") || 0), true);
if (hash.has("dig")) setArchaeo(true);
if (hash.has("play")) playBtn.click();
toWorld(G / 2, G / 2, cam.fTarget); cam.focus.copy(cam.fTarget);
function frame(now) {
  if (ctl.signal.aborted) { renderer.dispose(); return; }
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (playing) {
    setTick(curTick + tps * dt, false);
    if (curTick >= T - 1) { playing = false; playBtn.textContent = "play"; }
  }
  directorStep(Math.floor(curTick), now);
  updateMotion(curTick, now);
  updateMargins(Math.floor(curTick));
  // Day/night as a slow sun swing while playing (§2) — ambience, not record.
  if (playing) {
    const th = (curTick % 8) / 8 * Math.PI * 2, dayness = 0.5 + 0.5 * Math.sin(th);
    sun.position.set(Math.cos(th) * G * 0.6,
                     G * (0.18 + 0.45 * dayness), Math.sin(th) * G * 0.4);
    sun.intensity = 1.1 + 1.7 * dayness;
    scene.background.setHSL(0.09, 0.16, 0.045 + 0.035 * dayness);
    scene.fog.color.copy(scene.background);
  }
  updateSettlements(curTick);
  camStep(dt);
  updatePeople();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// A read-only window onto what is currently drawn, so the viewer can be
// checked by a driver instead of by eye. Counts only: nothing here can
// touch the history, which stays the CLI's and the oracle's business (§5).
window.__dawn = {
  tick: () => curTick,
  archaeo: () => archaeo,
  // Seek to a fractional tick (the scrubber's power, finer) and read where a
  // settlement slot currently stands — enough to check that the seasonal
  // disassembly moves continuously instead of teleporting.
  seek: (t) => { playing = false; playBtn.textContent = "play";
                 setTick(t, true); updateSettlements(t); },
  slotPos: (cid, id) => {
    const m = groups.get(String(cid))?.slots.get(id)?.mesh;
    return m && m.visible ? {x: +m.position.x.toFixed(4), z: +m.position.z.toFixed(4)} : null;
  },
  counts: () => ({scars: scarMeshes.length, settlements: groups.size,
                  labels: labelGroup.children.length,
                  jetties: jettyGroup.children.length,
                  boats: boatPool.filter(m => m.visible).length,
                  walkers: walkerPool.filter(m => m.visible).length,
                  fires: firePool.filter(g => g.visible).length,
                  people: peopleGroups.size}),
  attestation: (cid) => attestation(cid, Math.floor(curTick)),
};
}   // end boot()

boot(JSON.parse(document.getElementById("bundle").textContent));

// ---- drag-and-drop bundle loading (§6.3): one viewer, any world -------------
// dawn bundle writes stored (uncompressed) zips precisely so this parser
// stays ~30 lines with no vendored inflate. Derived fields are reshaped
// from the six raw files — reshaping only, never sim logic.
function readStoredZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let i = buf.byteLength - 22;
  while (i >= 0 && dv.getUint32(i, true) !== 0x06054b50) i--;
  if (i < 0) throw new Error("not a zip");
  const n = dv.getUint16(i + 10, true);
  let p = dv.getUint32(i + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true), cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (method !== 0) throw new Error("bundle must be stored, not deflated: " + name);
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    files[name] = td.decode(u8.subarray(start, start + csize));
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return files;
}
const jsonl = (t) => t.split("\n").filter(Boolean).map(s => JSON.parse(s));
function dataFromBundle(files) {
  const meta = JSON.parse(files["meta.json"]);
  const world = JSON.parse(files["world.json"]);
  if (!world.owner0) throw new Error("world.json lacks territory history (owner0)");
  const records = jsonl(files["journal.jsonl"]);
  const chron = jsonl(files["chronicle.jsonl"]);
  const sums = records.filter(r => r.type === "tick_summary");
  const evTypes = ["ratchet", "hardening", "fusion", "unfusion", "liberation",
                   "schism", "extinction"];
  const flows = {};
  for (const r of records)
    if (r.type === "defection" && r.to != null) {
      const k = `${Math.floor(r.tick / 20) * 20}|${r.culture}|${r.to}`;
      flows[k] = (flows[k] || 0) + 1;
    }
  return {
    seed: meta.seed, ticks: meta.ticks, grid: world.grid, biome: world.biome,
    owner0: world.owner0, deltas: world.deltas || [], elevation: world.elevation,
    water: world.water, rivers: world.rivers || [], configs: world.configs || {},
    structures: world.structures || {}, cultures: world.cultures,
    summaries: sums.map(s => ({tick: s.tick, c: Object.fromEntries(
      Object.entries(s.cultures).map(([cid, c]) => [cid,
        {pop: Math.round(c.pop), fused: !!c.fused, switching: c.switching !== false,
         dom: c.domination, mean: c.mean, sal: c.salience || null,
         fx: c.factions, cfg: c.dominant}]))})),
    events2: records.filter(r => evTypes.concat("succession").includes(r.type))
      .map(r => ({tick: r.tick, type: r.type, culture: r.culture, note: r.note,
                  mechanism: r.mechanism, structure: r.structure,
                  displaced: r.displaced})),
    deliberations: records.filter(r => r.type === "deliberation" &&
        ["encounter", "contradiction", "ratchet_crisis", "recovery"].includes(r.kind))
      .map(r => ({tick: r.tick, culture: r.culture, kind: r.kind, stance: r.stance,
                  speaker: r.speaker, text: r.text,
                  other: (r.detail || {}).other, model: r.model})),
    flows: Object.entries(flows).map(([k, n]) => {
      const [t, a, b] = k.split("|").map(Number);
      return {tick: t, from: a, to: b, n};
    }).sort((x, y) => x.tick - y.tick),
    feasts: records.filter(r => r.type === "feast" && r.other != null)
      .map(r => ({tick: r.tick, a: r.culture, b: r.other})),
    chronicle: chron.filter(c => evTypes.includes(c.event_type))
      .map(c => ({tick: c.tick, type: c.event_type, author: c.author_name,
                  medium: c.medium, text: c.text})),
    // cid and type carry archaeologist mode: attestation is per-author, and
    // beat citation needs the event key. Dropping them silently renders
    // every people unattested, which would be a lie about the record.
    margins: chron.map(c => ({tick: c.tick, cid: c.author, author: c.author_name,
                              medium: c.medium, text: c.text,
                              surviving: c.surviving, redacted: !!c.redacted,
                              type: c.event_type})),
  };
}
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  try {
    const files = readStoredZip(await f.arrayBuffer());
    location.hash = "";
    boot(dataFromBundle(files));
  } catch (err) { alert("could not read bundle: " + err.message); }
});
</script>
